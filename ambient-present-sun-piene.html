}

/* AMBIENT PRESENT SUPER FLY — program text generated from the theory above.

'use strict';
const $=id=>document.getElementById(id);
const HZ=10, N=150, FW=192, FH=108, RINGS=56, BANDS=15, PW=8, PH=5, FOV=65*Math.PI/180, KEPT_MAX=24, FIX_MAX=300;

  status(); }

    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}}); }
    catch(e1){ mic=false; stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false}); }
    if(!video){ video=document.createElement('video'); video.muted=true; video.playsInline=true; video.setAttribute('playsinline',''); }
    video.srcObject=new MediaStream(stream.getVideoTracks()); await video.play(); Cam.init(); Cam.prev=null;

    if(mic&&stream.getAudioTracks().length){ const src=ctx.createMediaStreamSource(new MediaStream(stream.getAudioTracks())); analyser=ctx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0.6; src.connect(analyser); abuf=new Uint8Array(analyser.fftSize); S.micOK=Tape.init(ctx,src); } else S.micOK=false;

  const entry=boxes(buf,from,to).find(b=>VISUAL.indexOf(b.type)>=0); if(!entry||entry.large) return null;
  const kids=entry.dataStart+78; if(kids<entry.end&&findBox(buf,kids,entry.end,'sv3d')) return buf;
  const add=sphericalBoxes(); const out=cat([buf.subarray(0,entry.end),add,buf.subarray(entry.end)]); const grow=add.length;
  const bump=start=>{ const s=readU32(out,start)+grow; out.set(u32(s),start); }; bump(entry.start); for(let i=chain.length-1;i>=0;i--) bump(chain[i].start); return out; }

function platePNG(eye){ const w=1536, h=768, c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle=P.paper; g.fillRect(0,0,w,h); const cw=w/(RINGS*3.2*2);
  for(let k=0;k<FN;k++){ if(!eye.has[k]) continue; const p=pts[k]; const cx=(p.lon+Math.PI)/(Math.PI*2)*w, cy=(Math.PI/2-p.lat)/Math.PI*h; for(let q=0;q<PW*PH;q++){ const b=(k*PW*PH+q)*3; const r=eye.px[b],gg=eye.px[b+1],bb=eye.px[b+2]; const lum=(r*0.299+gg*0.587+bb*0.114)/255; const rad=(cw/PW)*(0.14+0.42*(theme==='dark'?lum:1-lum)); g.fillStyle=`rgb(${r},${gg},${bb})`; g.beginPath(); g.arc(cx+((q%PW)-(PW-1)/2)*cw/PW,cy+(((q/PW)|0)-(PH-1)/2)*cw/PW,rad,0,7); g.fill(); } }
  const bin=atob(c.toDataURL('image/png').split(',')[1]); const out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
async function makeClip(m,btn){ if(m.clip){ deliver(m.clip,m); return; } if(!window.MediaRecorder||!Play.imgs){ say('no recorder here'); return; }
  const type=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>{ try{ return MediaRecorder.isTypeSupported(t); }catch(e){ return false; } }); if(!type){ say('no recorder here'); return; }
  const dur=Play.dur(), oc=document.createElement('canvas'); oc.width=oc.height=720; const og=oc.getContext('2d'); const tracks=[...oc.captureStream(30).getVideoTracks()]; let asrc=null;
  if(Play.buf){ const ctx=await ensureCtx(); const dest=ctx.createMediaStreamDestination(); asrc=ctx.createBufferSource(); asrc.buffer=Play.buf; asrc.connect(dest); tracks.push(...dest.stream.getAudioTracks()); }
  const rec=new MediaRecorder(new MediaStream(tracks),{mimeType:type,videoBitsPerSecond:3e6}); const chunks=[]; rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); }; const stopped=new Promise(r=>rec.onstop=r);
  Play.pause(); rec.start(200); const t0=performance.now(); if(asrc) asrc.start(); const MAX=Math.ceil((dur+0.2)*60);
  await new Promise(res=>{ let n=0; const tick=()=>{ const t=(performance.now()-t0)/1000; const im=Play.imgs[Math.min(Play.imgs.length-1,Math.floor(Math.min(1,t/dur)*Play.imgs.length))]; og.fillStyle=P.paper; og.fillRect(0,0,720,720); if(im) halftone(og,im,40,120,640,360,96); const tmp=document.createElement('div'); const c=dotText(tmp,`${hms(new Date(m.start))}  AMBIENT PRESENT`,{size:1.3,max:640,color:P.dim}); const d=Math.min(2,devicePixelRatio||1); og.drawImage(c,(720-c.width/d)/2,560,c.width/d,c.height/d); dotText(btn,'CLIP '+Math.min(Math.ceil(t),Math.round(dur))+'/'+Math.round(dur),{size:1.0}); if(t<dur+0.1&&++n<MAX) requestAnimationFrame(tick); else res(); }; tick(); });
  rec.stop(); await stopped; if(asrc){ try{ asrc.stop(); }catch(e){} } m.clip=new File(chunks,'present-'+m.id+'.'+(type.startsWith('video/mp4')?'mp4':'webm'),{type:type.split(';')[0]}); dotText(btn,'SEND CLIP',{size:1.0}); say('clip ready. send clip opens the share sheet. save clip downloads'); const sv=document.createElement('button'); dotText(sv,'SAVE CLIP',{size:1.0}); sv.onclick=ev=>{ ev.stopPropagation(); deliver(m.clip,m,'download'); }; btn.parentElement&&btn.parentElement.appendChild(sv); }
async function deliver(file,m,how){ const data={files:[file],title:m.name}; if(how!=='download'&&navigator.share&&navigator.canShare&&navigator.canShare(data)){ try{ await navigator.share(data); return; }catch(e){ if(e.name==='AbortError') return; } } say('saved to downloads: '+file.name); const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); }

/* ---------- words: one line, one status row, one state word ---------- */
const line=$('line');
function say(html){ if(line.dataset.last===html) return; line.dataset.last=html; if(/<[a-z]/i.test(html)) line.innerHTML=html; else dotText(line,dotWrap(html,34),{size:1.1}); }
function fault(what,fix){ setMode('FAULT'); line.innerHTML='<span class="err">'+what+'</span>\n'+(fix||''); delete line.dataset.last; }
line.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(b&&b.dataset.act==='sim'){ ev.stopPropagation(); startSim(); } });
const haptic=p=>{ if(navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} };
function setMode(m){ S.mode=m; keysFor(); $('dot').style.background=({INTRO:P.dim,ASK:P.dim,LIVE:P.warm,HELD:`rgb(${P.ink})`,PLAY:P.warm,FAULT:`rgb(${P.rust})`})[m]||P.dim;
  if(m==='ASK') say('tap the orb\nso it can see and hear the room'); if(m==='LIVE') say(S.taps<1?(M.name+': '+M.line+'\ntap to hold fifteen seconds'):''); }
function status(){ const D=(el,t,on,bad)=>dotText(el,t,{size:1.0,color:on?`rgb(${P.ink})`:(bad?`rgb(${P.rust})`:P.dim)});
  D($('s-cam'),S.hearing?(S.micOK?'CAM+MIC':'CAM'):(S.sim?'MADE-UP':'OFF'),S.hearing||S.sim,S.hearing&&!S.micOK); D($('s-sun'),'SUN',S.sun,false); D($('s-sodium'),'SODIUM',S.sodium,false); D($('s-gps'),'GPS',fixes.length>0,!!S.gpsWhy); D($('s-theme'),theme==='dark'?'NIGHT':'DAY',false); }
function seenSplit(){ let seen=0,dreamed=0; for(let i=0;i<TN;i++){ if(Tex.has[i]===1) seen++; else if(Tex.has[i]===2) dreamed++; } return [seen/TN,dreamed/TN]; }
function stateWord(){ const [sn,dr]=seenSplit(); const t=Play.m?'PLAYING':S.held?'HELD':(S.mode==='LIVE'?'SEEN '+Math.round(sn*100)+'%  DREAMED '+Math.round(dr*100)+'%':S.mode==='ASK'?'OFF':S.mode==='FAULT'?'FAULT':''); dotText($('sysword'),t,{size:0.9,color:P.dim,max:160}); }

/* ---------- the loop: bounded work per frame; the frame is the only clock ---------- */
let last=performance.now(), frames=0;
function frame(ts){ try{ const dt=Math.min(100,ts-last); last=ts; S.now=ts/1000; if(document.hidden){ requestAnimationFrame(frame); return; }
  sense(dt); if(!S.held&&!Play.m&&(S.hearing||S.sim)){ slice(dt); dream(); }
  if(S.intro<1&&!reduceMotion){ S.intro+=dt/2400; S.rot=(1-S.intro)*Math.PI*1.2; S.tilt=0.18; } else { S.rot+=dt/1000*Math.PI*2*M.rotHz; S.still=S.motion<0.05?Math.min(60,S.still+dt/1000):Math.max(0,S.still-dt/500);
    const bored=S.still>8||!S.gotOri;                         // still for eight seconds, or no sensor: the sun wanders on its own
    if(bored){ const t=S.now*2*Math.PI/M.wanderPeriod; const lam=Math.sin(t*3)*Math.PI, phi=Math.sin(t*2+1)*0.9; const bl=Math.min(1,(S.still-8)/6); const w=[Math.cos(phi)*Math.sin(lam),Math.sin(phi),Math.cos(phi)*Math.cos(lam)]; if(!S.gotOri) S.aim=w; else { S.aim=[S.fwd[0]+(w[0]-S.fwd[0])*bl,S.fwd[1]+(w[1]-S.fwd[1])*bl,S.fwd[2]+(w[2]-S.fwd[2])*bl]; } } else S.aim=S.fwd.slice(); }

  drawOrb(); if(!tiny()){ if(!M.hidePicture) drawPicture(); drawStrip(); } if((++frames&7)===0) stateWord();
 }catch(e){ say('<span class="err">drawing broke</span>\nit is still recording'); } requestAnimationFrame(frame); }
function sense(dt){ Sun.room(S.audio); let ae=0; if(analyser&&abuf){ analyser.getByteTimeDomainData(abuf); let s=0; for(let i=0;i<abuf.length;i++){ const v=(abuf[i]-128)/128; s+=v*v; } ae=Math.min(1,Math.sqrt(s/abuf.length)*5); } else if(S.sim) ae=0.1+0.5*Math.abs(Math.sin(S.now*1.3))*Math.random(); S.audio=Math.max(S.audio*0.85,ae); }
const SW=32, SH=18; const smallC=document.createElement('canvas'); smallC.width=SW; smallC.height=SH; const smallG=smallC.getContext('2d',{willReadFrequently:true});
function shrink(img){ const t=halftone.t||(halftone.t=document.createElement('canvas')); t.width=FW; t.height=FH; t.getContext('2d').putImageData(img,0,0); smallG.drawImage(t,0,0,SW,SH); try{ return smallG.getImageData(0,0,SW,SH).data.slice(); }catch(e){ return null; } }
function slice(dt){ S.sliceClock+=dt; let guard=0; while(S.sliceClock>=1000/HZ&&guard++<4){ S.sliceClock-=1000/HZ; const f=Cam.grab(); if(f){ S.motion=f.mo; if((S.paintCount=(S.paintCount||0)+1)%M.paintEvery===0) paintTex(f.img); } Trace.push(S.audio,S.motion,S.now,f?f.img:null,S.gotOri?S.fwd:S.aim,f?shrink(f.img):null); } }

/* ---------- gestures: tap holds · drag turns (or aims) · picture scrubs · up keeps · down lets go ---------- */
let p0=null, pLast=null, moved=false;
cv.addEventListener('pointerdown',ev=>{ ensureCtx().catch(()=>{}); if(S.mode==='INTRO'){ S.intro=1; setMode('ASK'); return; } if(S.mode==='ASK'||S.mode==='FAULT'){ start(); return; } p0={x:ev.clientX,y:ev.clientY}; pLast={x:ev.clientX,y:ev.clientY}; moved=false; cv.setPointerCapture(ev.pointerId); });
cv.addEventListener('pointermove',ev=>{ if(!p0) return; const dx=ev.clientX-pLast.x, dy=ev.clientY-pLast.y; pLast={x:ev.clientX,y:ev.clientY}; if(Math.hypot(ev.clientX-p0.x,ev.clientY-p0.y)>8) moved=true; if(!moved) return;
  /* the orb is not a control */ });
cv.addEventListener('pointerup',ev=>{ if(!p0) return; const dy=ev.clientY-p0.y, dx=ev.clientX-p0.x;
  if(!moved){ if(tiny()&&S.held){ if(ev.clientY<orbY()) keep(); else { letGo(); say('let go'); } } else if(Play.m){ ensureCtx().then(()=>{ Play.toggle(); keysFor(); }); } else if(!S.held){ S.taps++; try{ localStorage.setItem('ap.taps',S.taps); }catch(e){} hold(); } } p0=null; });
cv.addEventListener('pointercancel',()=>{ p0=null; });
let pd=null;
picC.addEventListener('click',ev=>{ ev.stopPropagation(); if(Play.m) ensureCtx().then(()=>{ Play.toggle(); keysFor(); }); else if(!S.held) hold(); });
strip.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); pd={was:Play.playing}; strip.setPointerCapture(ev.pointerId); if(Play.m) Play.pause(); scrubTo(ev); });
strip.addEventListener('pointermove',ev=>{ if(pd) scrubTo(ev); });
strip.addEventListener('pointerup',()=>{ if(!pd) return; if(Play.m&&pd.was) Play.start(); pd=null; keysFor(); });
strip.addEventListener('pointercancel',()=>{ pd=null; });
function scrubTo(ev){ const r=strip.getBoundingClientRect(); const u=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)); if(Play.m) Play.off=u*Play.dur(); else if(S.held) S.scrub=u; }
$('s-cam').addEventListener('click',ev=>{ ev.stopPropagation(); if(S.hearing){ facing=facing==='user'?'environment':'user'; start(); } else start(); });
$('s-sun').addEventListener('click',async ev=>{ ev.stopPropagation(); S.sun=!S.sun; try{ const c=await ensureCtx(); Sun.init(c); Sun.set(S.sun); }catch(e){} status(); say(S.sun?'the sun hums. a heart at rest, the room remembered in whispers':'the sun is silent'); });
$('s-sodium').addEventListener('click',ev=>{ ev.stopPropagation(); S.sodium=!S.sodium; status(); say(S.sodium?'sodium light: one wavelength, and a mirror':'the room in its own colours'); });
$('s-gps').addEventListener('click',ev=>{ ev.stopPropagation(); say(fixes.length?('position '+fixes[fixes.length-1].lat.toFixed(5)+' '+fixes[fixes.length-1].lon.toFixed(5)):(S.gpsWhy||'asking')); });
$('s-theme').addEventListener('click',ev=>{ ev.stopPropagation(); theme=theme==='dark'?'light':'dark'; applyTheme(); status(); dotText($('title'),'AMBIENT PRESENT SUN',{size:1.1,align:'left'}); });
addEventListener('keydown',ev=>{ if(ev.key===' '&&!Play.m&&!S.held) hold(); else if(ev.key==='Enter'&&S.held) keep(); else if(ev.key==='Escape'){ if(Play.m) closeMoment(); else if(S.held) letGo(); } });

/* ---------- boot ---------- */
(function title(){ const s='AMBIENT PRESENT SUN  '+M.name, t=$('title'); let i=0; if(reduceMotion){ dotText(t,s,{size:1.1,align:'left'}); return; } const iv=setInterval(()=>{ dotText(t,s.slice(0,++i),{size:1.1,align:'left'}); if(i>=s.length) clearInterval(iv); },70); })();
status(); setMode('INTRO'); setTimeout(()=>{ if(S.mode==='INTRO') setMode('ASK'); },2600); requestAnimationFrame(frame);
</script>
