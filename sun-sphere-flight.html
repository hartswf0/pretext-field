<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070604">
<title>Sun Sphere Flight</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070604;color:#f1eadb;font-family:ui-monospace,Menlo,monospace}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:11px;letter-spacing:.18em;color:#8b7652}
</style>
</head>
<body>
<div id="loading">SUN SPHERE · BODY FLIGHT</div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/hartswf0/pretext-field/643e88cb62829b390cf4e0cf40afbdeefc2cafad/hug-the-sun.html';
  try{
    const r=await fetch(source,{cache:'no-store'});
    if(!r.ok) throw new Error('source '+r.status);
    const html=await r.text();
    document.open();
    document.write(html.replace(/<title>Hug the Sun<\/title>/,'<title>Sun Sphere Flight</title>'));
    document.close();
  }catch(err){
    document.getElementById('loading').textContent='COULD NOT LOAD SUN SPHERE FLIGHT';
    console.error(err);
  }
})();
</script>
</body>
</html>
