line.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b) return; ev.stopPropagation(); if(b.dataset.act==='sim') startSim(); else if(b.dataset.act==='retry'){ if(Net.role==='guest'&&Net.code) Net.join(Net.code); else if(Net.role==='host') Net.host(Net.code); else say(''); } else if(b.dataset.act==='new'){ Net.role=null; askName('host'); } });
const haptic=p=>{ if(navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} };
function setMode(m){ S.mode=m; keysFor(); $('dot').style.background=({INTRO:P.dim,ASK:P.dim,LIVE:P.warm,HELD:`rgb(${P.ink})`,PLAY:P.warm,FAULT:`rgb(${P.rust})`})[m]||P.dim;
  if(m==='ASK') say(''); if(m==='LIVE'){ Mesh.t0=S.now; Mesh.go('LOOK'); } }
function status(){ const D=(el,t,on,bad)=>dotText(el,t,{size:1.0,color:on?`rgb(${P.ink})`:(bad?`rgb(${P.rust})`:P.dim)});
  D($('s-cam'),S.hearing?(S.micOK?'CAM+MIC':'CAM'):(S.sim?'MADE-UP':'OFF'),S.hearing||S.sim,S.hearing&&!S.micOK); D($('s-aim'),'AIM',S.gotOri,!!S.oriWhy&&!S.gotOri); D($('s-gps'),'GPS',fixes.length>0,!!S.gpsWhy); $('s-together').hidden=true; D($('s-theme'),theme==='dark'?'NIGHT':'DAY',false); }
function seenSplit(){ let seen=0,dreamed=0; for(let i=0;i<TN;i++){ if(Tex.has[i]===1) seen++; else if(Tex.has[i]===2) dreamed++; } return [seen/TN,dreamed/TN]; }
function stateWord(){ const [sn,dr]=seenSplit(); if(S.mode==='LIVE'){ dotText($('sysword'),Math.round(Math.min(Trace.count,N)/HZ)+'S HELD  '+Math.round(sn*100)+'%',{size:0.9,color:P.dim,max:Math.min(300,W*0.7)}); return; } const t=Play.m?'PLAYING':S.held?'HELD':(S.mode==='LIVE'?(Net.role?(Net.role==='host'?'HOSTING ':'IN ')+Net.code+'  '+(1+Net.who.size)+' HERE':Solarium.suns.length+' SUNS  '+Solarium.days()+' DAYS  '+Solarium.layers.length+' LAYERS'):S.mode==='ASK'?'OFF':S.mode==='FAULT'?'FAULT':''); dotText($('sysword'),t,{size:0.9,color:P.dim,max:160}); }

/* ---------- the loop: bounded work per frame; the frame is the only clock ---------- */
let last=performance.now(), frames=0;
function frame(ts){ try{ const dt=Math.min(100,ts-last); last=ts; S.now=ts/1000; if(document.hidden){ requestAnimationFrame(frame); return; }
  sense(dt); if(!S.held&&!Play.m&&(S.hearing||S.sim)){ slice(dt); dream(); }
  if(S.intro<1&&!reduceMotion){ S.intro+=dt/2400; S.rot=(1-S.intro)*Math.PI*1.2; S.tilt=0.18; } if(S.spin&&!p0){ S.rot-=S.spin; S.spin*=Math.pow(0.001,dt/900); if(Math.abs(S.spin)<0.0004) S.spin=0; } else { if(S.now-S.touched>20) S.rot+=dt/1000*0.035; if(!S.gotOri){ const lam=S.now*0.15; S.aim=[Math.sin(lam)*0.95,0.15*Math.sin(S.now*0.4),Math.cos(lam)*0.95]; } }

  Celestial.tick(); Mesh.tick(); Net.tick(); drawOrb(); if(!tiny()&&S.mode==='LIVE'){ const m=Inspect.m; Ray.draw(CTX,20,orbY()+orbR()+10,W-40,m?new Date(m.at):null,m?m.place:null,0.78); if((frames&3)===0) drawTrim(); } if((frames&15)===0&&!tiny()) drawDays(); if(S.setting){ const k=Math.min(1,(S.now-S.setting)/3); const g=CTX; g.fillStyle=theme==='dark'?`rgba(0,0,0,${Math.sin(k*Math.PI)*0.85})`:`rgba(239,233,218,${Math.sin(k*Math.PI)*0.85})`; g.fillRect(0,0,W,H); if(k>=1) S.setting=0; } if(!tiny()){ layout(); drawPlate(); } if((++frames&7)===0) stateWord();
 }catch(e){ say('<span class="err">drawing broke</span>\nit is still recording'); } requestAnimationFrame(frame); }
function sense(dt){ let ae=0; if(analyser&&abuf){ analyser.getByteTimeDomainData(abuf); let s=0; for(let i=0;i<abuf.length;i++){ const v=(abuf[i]-128)/128; s+=v*v; } ae=Math.min(1,Math.sqrt(s/abuf.length)*5); } else if(S.sim) ae=0.1+0.5*Math.abs(Math.sin(S.now*1.3))*Math.random(); S.audio=Math.max(S.audio*0.85,ae); }
const SW=32, SH=18; const smallC=document.createElement('canvas'); smallC.width=SW; smallC.height=SH; const smallG=smallC.getContext('2d',{willReadFrequently:true});
function shrink(img){ const t=halftone.t||(halftone.t=document.createElement('canvas')); t.width=FW; t.height=FH; t.getContext('2d').putImageData(img,0,0); smallG.drawImage(t,0,0,SW,SH); try{ return smallG.getImageData(0,0,SW,SH).data.slice(); }catch(e){ return null; } }
function slice(dt){ S.sliceClock+=dt; let guard=0; while(S.sliceClock>=1000/HZ&&guard++<4){ S.sliceClock-=1000/HZ; const f=Cam.grab(); if(f){ S.motion=f.mo; } const bf=Brush.m?Brush.frame():(f?f.img:null); if(bf) paintTex(bf); Trace.push(S.audio,S.motion,S.now,f?f.img:null,Hand.aim(),f?shrink(f.img):null); if(Hand.locked&&S.motion>0.35&&!Brush.m) Hand.clear(); } }

/* ---------- gestures: tap holds · drag turns (or aims) · picture scrubs · up keeps · down lets go ---------- */
let p0=null, pLast=null, moved=false;
let handDrag=false;
function orbDir(px,py){ const R=orbR(), x=(px-W/2)/R, y=-(py-orbY())/R; const rr=x*x+y*y; if(rr>1) return null; const z=Math.sqrt(1-rr); const ct=Math.cos(S.tilt), st=Math.sin(S.tilt); const y2=y*ct+z*st, z2=-y*st+z*ct; const lam=Math.atan2(x,z2)-S.rot, phi=Math.asin(Math.max(-1,Math.min(1,y2))); return dirFromLatLon(phi,lam); }
cv.addEventListener('pointerdown',ev=>{ ensureCtx().catch(()=>{}); if(S.mode==='INTRO'){ S.intro=1; setMode('ASK'); return; } if(S.mode==='ASK'||S.mode==='FAULT'){ S.flash=S.now; haptic([14,40,24]); start(); return; } p0={x:ev.clientX,y:ev.clientY}; pLast={x:ev.clientX,y:ev.clientY}; moved=false; cv.setPointerCapture(ev.pointerId);
  handDrag=false; if(!World.on&&(S.hearing||S.sim)){ const d=orbDir(ev.clientX,ev.clientY); if(d){ const a=Hand.aim(); const dot=d[0]*a[0]+d[1]*a[1]+d[2]*a[2]; if(dot>Math.cos(0.42)) handDrag=true; } } });
cv.addEventListener('pointermove',ev=>{ if(!p0) return; const dx=ev.clientX-pLast.x, dy=ev.clientY-pLast.y; pLast={x:ev.clientX,y:ev.clientY}; if(Math.hypot(ev.clientX-p0.x,ev.clientY-p0.y)>8) moved=true; if(!moved) return; if(World.on){ World.rot+=dx/orbR(); World.tilt=Math.max(-1.3,Math.min(1.3,World.tilt+dy/orbR())); return; } if(handDrag){ const d=orbDir(ev.clientX,ev.clientY); if(d) Hand.set(d); return; }
  S.spin=dx/orbR(); S.rot-=dx/orbR(); S.tilt=Math.max(-1.2,Math.min(1.2,S.tilt+dy/orbR())); S.touched=S.now; });
cv.addEventListener('pointerup',ev=>{ if(!p0) return; const dy=ev.clientY-p0.y, dx=ev.clientX-p0.x; if(World.on){ if(!moved){ const m=World.pick(ev.clientX,ev.clientY); if(m) openSun(m); } p0=null; return; }
  if(!moved){ if(tiny()&&S.held){ if(ev.clientY<orbY()) keep(); else { letGo(); say('let go'); } } else if(Play.m){ ensureCtx().then(()=>{ Play.toggle(); keysFor(); }); } else if(!S.held){ S.taps++; try{ localStorage.setItem('ap.taps',S.taps); }catch(e){} hold(); } } p0=null; });
cv.addEventListener('pointercancel',()=>{ p0=null; });
let pd=null;
picC.addEventListener('click',ev=>{ ev.stopPropagation(); if(Brush.m) Brush.use(null); });
strip.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); pd={was:Play.playing}; strip.setPointerCapture(ev.pointerId); if(Play.m) Play.pause(); scrubTo(ev); });
strip.addEventListener('pointermove',ev=>{ if(pd) scrubTo(ev); });
strip.addEventListener('pointerup',()=>{ if(!pd) return; if(Play.m&&pd.was) Play.start(); pd=null; keysFor(); });
strip.addEventListener('pointercancel',()=>{ pd=null; });
function scrubTo(ev){ const r=strip.getBoundingClientRect(); const u=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)); if(Play.m) Play.off=u*Play.dur(); else if(S.held) S.scrub=u; }
$('s-cam').addEventListener('click',ev=>{ ev.stopPropagation(); if(S.hearing){ facing=facing==='user'?'environment':'user'; start(); } else start(); });
$('s-aim').addEventListener('click',ev=>{ ev.stopPropagation(); if(S.gotOri) say('the rings ride at the height you looked'); else { say(S.oriWhy||'asking for motion'); if(!S.oriWhy) sensors(); } });
$('s-gps').addEventListener('click',ev=>{ ev.stopPropagation(); say(fixes.length?('position '+fixes[fixes.length-1].lat.toFixed(5)+' '+fixes[fixes.length-1].lon.toFixed(5)):(S.gpsWhy||'asking')); });
$('s-together').addEventListener('click',ev=>{ ev.stopPropagation(); S.together=!S.together; status(); keysFor(); say(S.together?'open a sun for others, or join one':''); });
$('s-theme').addEventListener('click',ev=>{ ev.stopPropagation(); theme=theme==='dark'?'light':'dark'; applyTheme(); status(); dotText($('title'),'SOLAR CUE',{size:1.1,align:'left'}); });
addEventListener('keydown',ev=>{ if(ev.key===' '&&!Play.m&&!S.held) hold(); else if(ev.key==='Enter'&&S.held) keep(); else if(ev.key==='Escape'){ if(Play.m) closeMoment(); else if(S.held) letGo(); } });

/* ---------- boot ---------- */
(function title(){ const s='SOLAR CUE', t=$('title'); let i=0; if(reduceMotion){ dotText(t,s,{size:1.1,align:'left'}); return; } const iv=setInterval(()=>{ dotText(t,s.slice(0,++i),{size:1.1,align:'left'}); if(i>=s.length) clearInterval(iv); },70); })();
$('importfile').addEventListener('change',ev=>{ const fs=[...(ev.target.files||[])].slice(0,20); ev.target.value=''; fs.forEach(async f=>{ if(/json$/i.test(f.name)||f.type==='application/json'){ if(await receivePackage(f)) return; } Solarium.fromPicture(f); }); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S.mode==='LIVE') Solarium.keep('AUTO'); }); addEventListener('pagehide',()=>{ if(S.mode==='LIVE') Solarium.keep('AUTO'); }); setInterval(()=>{ if(S.mode==='LIVE'&&!document.hidden) Solarium.keep('AUTO'); },10*60*1000);
Solarium.load(); status(); setMode('INTRO'); setTimeout(()=>{ if(S.mode==='INTRO') setMode('ASK'); },2600); requestAnimationFrame(frame);
</script>
