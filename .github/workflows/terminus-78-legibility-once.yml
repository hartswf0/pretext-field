name: Terminus 78 Legibility Repair

on:
  push:
    paths:
      - 'scripts/terminus-78-legibility.py'
      - '.github/workflows/terminus-78-legibility-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply legibility repair
        run: python scripts/terminus-78-legibility.py
      - name: Syntax check module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('terminus-one-78.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S)
          js='\n'.join(body for attrs,body in blocks
                       if 'src=' not in attrs.lower() and 'importmap' not in attrs.lower())
          Path('/tmp/terminus78.js').write_text(js,encoding='utf-8')
          subprocess.run(['node','--check','/tmp/terminus78.js'],check=True)
          PY
      - name: Verify visible-control invariants
        run: |
          grep -q '78.1 · LEGIBLE GEONOSIS CONTROLS' terminus-one-78.html
          grep -q 'VIEWPOINT · TAP TO CHANGE' terminus-one-78.html
          grep -q 'MAP LAYERS · TAP TO CHANGE' terminus-one-78.html
          grep -q 'RAW FIELD HIDDEN' terminus-one-78.html
          grep -q "G78.filter === 'ALL'" terminus-one-78.html
      - name: Commit repaired 78
        run: |
          if git diff --quiet -- terminus-one-78.html; then exit 0; fi
          git config user.name 'Watson Hartsoe'
          git config user.email 'watson.hartsoe@gmail.com'
          git add terminus-one-78.html
          git commit -m 'fix: make Terminus 78 controls visibly consequential'
          git push
