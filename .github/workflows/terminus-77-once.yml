name: Build Terminus One 77

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terminus-77-once.yml

permissions:
  contents: write

jobs:
  build-77:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fork 76 and inject world signal field
        shell: bash
        run: |
          cp terminus-one-76.html terminus-one-77.html
          python -c "from pathlib import Path; p=Path('terminus-one-77.html'); s=p.read_text(encoding='utf-8'); inj=Path('scripts/terminus-77-world-signal.js').read_text(encoding='utf-8'); s=s.replace('<title>TERMINUS ONE · a departures board you can fly</title>','<title>TERMINUS ONE 77 · the world answers</title>',1).replace('TERMINUS ONE · v2','TERMINUS ONE · 77 · THE WORLD ANSWERS',1); i=s.rfind('</script>'); assert i>=0, 'final script close missing'; s=s[:i]+'\\n'+inj+'\\n'+s[i:]; p.write_text(s,encoding='utf-8')"
          grep -q "TERMINUS ONE · 77 · THE WORLD ANSWERS" terminus-one-77.html
          grep -q "WORLD SIGNAL FIELD" terminus-one-77.html
          grep -q "OPEN-METEO" terminus-one-77.html
          grep -q "earthquake.usgs.gov" terminus-one-77.html
          grep -q "function releaseDrop()" terminus-one-77.html
          grep -q 'id="tzL"' terminus-one-77.html
          grep -q 'id="tzR"' terminus-one-77.html
          test $(wc -c < terminus-one-77.html) -gt $(wc -c < terminus-one-76.html)
          echo "76 bytes: $(wc -c < terminus-one-76.html)"
          echo "77 bytes: $(wc -c < terminus-one-77.html)"

      - name: Commit Terminus One 77
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminus-one-77.html
          git diff --cached --check
          git commit -m "feat: fork Terminus One 77 world signals"
          git push origin HEAD:main
