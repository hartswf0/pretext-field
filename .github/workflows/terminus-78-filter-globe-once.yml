name: Terminus 78 Globe Filter Parity

on:
  push:
    paths:
      - '.github/workflows/terminus-78-filter-globe-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Make 3D raw field obey map filter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('terminus-one-78.html')
          s=p.read_text(encoding='utf-8')
          old="""g78UpdateWindVector = function(){
            const r = g781WindBase();
            g781UpdateFocus3D();
            return r;
          };"""
          new="""g78UpdateWindVector = function(){
            const r = g781WindBase();
            /* same layer law on globe and map: raw observations exist only in ALL SIGNALS */
            g78EarthGroup.visible = G78.filter === 'ALL' && morphT < 0.18;
            g781UpdateFocus3D();
            return r;
          };"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('terminus-one-78.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S)
          js='\n'.join(body for attrs,body in blocks if 'src=' not in attrs.lower() and 'importmap' not in attrs.lower())
          Path('/tmp/terminus78.js').write_text(js,encoding='utf-8')
          subprocess.run(['node','--check','/tmp/terminus78.js'],check=True)
          PY
          grep -q "g78EarthGroup.visible = G78.filter === 'ALL'" terminus-one-78.html
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/terminus-78-filter-globe-once.yml
          git config user.name 'Watson Hartsoe'
          git config user.email 'watson.hartsoe@gmail.com'
          git add terminus-one-78.html .github/workflows/terminus-78-filter-globe-once.yml
          git commit -m 'fix: make Terminus 78 map layers obvious on globe and map'
          git push
