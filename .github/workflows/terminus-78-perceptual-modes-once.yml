name: Terminus 78 Perceptual Modes

on:
  push:
    paths:
      - 'scripts/terminus-78-perceptual-modes.py'
      - '.github/workflows/terminus-78-perceptual-modes-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply perceptual modes
        run: python scripts/terminus-78-perceptual-modes.py
      - name: Syntax check executable scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('terminus-one-78.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S)
          js=[]
          for attrs,body in blocks:
            a=attrs.lower()
            if 'src=' in a or 'importmap' in a or 'application/json' in a: continue
            js.append(body)
          Path('/tmp/terminus78.js').write_text('\n'.join(js),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/terminus78.js'],check=True)
          PY
      - name: Verify perceptual invariants
        run: |
          grep -q '78.2 · PERCEPTUAL MODES' terminus-one-78.html
          grep -q 'data-agent="PLANE"' terminus-one-78.html
          grep -q 'data-agent="MAIL"' terminus-one-78.html
          grep -q 'data-agent="CITY"' terminus-one-78.html
          grep -q 'data-agent="WORLD"' terminus-one-78.html
          grep -q 'MAIL CORRIDOR' terminus-one-78.html
          grep -q 'CITY · DESTINATION FIELD' terminus-one-78.html
          grep -q 'IMPORTANT · RAW FIELD OFF' terminus-one-78.html
          grep -q 'ALL SIGNALS · EARTH' terminus-one-78.html
      - name: Commit repaired 78
        run: |
          if git diff --quiet -- terminus-one-78.html; then exit 0; fi
          git config user.name 'Watson Hartsoe'
          git config user.email 'watson.hartsoe@gmail.com'
          git add terminus-one-78.html
          git commit -m 'fix: make Terminus 78 modes perceptually distinct'
          git push
