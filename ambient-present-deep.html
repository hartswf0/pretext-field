function status(){ const D=(el,t,on,bad)=>{ dotText(el,t,{size:1.0,color:on?`rgb(${P.ink})`:(bad?`rgb(${P.rust})`:P.dim)}); };
  D($('s-cam'),hearing?(micOK?'CAM+MIC':'CAM'):(sim?'MADE-UP':'OFF'),hearing||sim,hearing&&!micOK); D($('s-ori'),'AIM',gotOri,!!oriWhy&&!gotOri); D($('s-gps'),'GPS',fixes.length>0,!!gpsWhy); D($('s-now'),cursor==null?'NOW':'BACK',cursor!=null); D($('s-theme'),theme==='dark'?'DARK':'LIGHT',false); }

/* ---------- painting the field: the frame lands where the phone points; each cell remembers ---------- */
let curAudio=0, curMotion=0, lastPaintAt=0;
function paintFrame(img,mo){
  const t=now; let f=fwd, u=up; if(!gotOri){ f=aimFwd; u=[0,1,0]; }
  const dp=f[0]*u[0]+f[1]*u[1]+f[2]*u[2]; u=[u[0]-f[0]*dp,u[1]-f[1]*dp,u[2]-f[2]*dp]; const lu=Math.hypot(u[0],u[1],u[2])||1; u=[u[0]/lu,u[1]/lu,u[2]/lu]; const r=[u[1]*f[2]-u[2]*f[1],u[2]*f[0]-u[0]*f[2],u[0]*f[1]-u[1]*f[0]];
  const tx=Math.tan(FOV/2), ty=tx*FH/FW, a=img.data, cosLim=Math.cos(FOV*0.8); let cells=0;
  for(let i=0;i<TN;i++){ const dx=TDIR[i*3],dy=TDIR[i*3+1],dz=TDIR[i*3+2]; const z=dx*f[0]+dy*f[1]+dz*f[2]; if(z<cosLim) continue; const px=(dx*r[0]+dy*r[1]+dz*r[2])/z/tx, py=(dx*u[0]+dy*u[1]+dz*u[2])/z/ty; if(px<-1||px>1||py<-1||py>1) continue;
    const sx=Math.min(FW-1,Math.floor((px+1)/2*FW)), sy=Math.min(FH-1,Math.floor((1-py)/2*FH)); const j=(sy*FW+sx)*4; Cell.put(i,a[j],a[j+1],a[j+2],t,curAudio,mo); cells++; }
  lastPaintAt=t; }
const FOV=65*Math.PI/180; let aimFwd=[0,0,1];

/* ---------- the orb: one dot per direction; colour, size, halo, age, all from the stack ---------- */
const pts=[]; for(let r=0;r<RINGS;r++){ const lat=-Math.PI/2+(r+0.5)/RINGS*Math.PI; const n=Math.max(6,Math.round(Math.cos(lat)*RINGS*4.6)); for(let k=0;k<n;k++) pts.push({lat,lon:k/n*Math.PI*2-Math.PI}); }
const cv=$('stage'), ctx=cv.getContext('2d'); let W=0,H=0, rot=0, tilt=0.18;
function resize(){ const d=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(d,0,0,d,0,0); } addEventListener('resize',resize); resize();
const tiny=()=>Math.min(W,H)<340; const orbR=()=>tiny()?Math.min(W,H)*0.36:Math.min(W*0.34,H*0.19,260); const orbY=()=>tiny()?H/2:H*0.42-orbR()-8;
function proj(lat,lon){ const x=Math.cos(lat)*Math.cos(lon-rot), y=Math.sin(lat), z=Math.cos(lat)*Math.sin(lon-rot); const y2=y*Math.cos(tilt)-z*Math.sin(tilt), z2=y*Math.sin(tilt)+z*Math.cos(tilt); return [x,y2,z2]; }
function drawOrb(){
  const R=orbR(), cxp=W/2, cyp=orbY(), at=cursor==null?now:cursor; ctx.fillStyle=P.paper; ctx.fillRect(0,0,W,H);
  const marks=[]; for(const p of pts){ const [x,y,z]=proj(p.lat,p.lon); if(z<-0.15) continue; const o=Cell.latest(cellOf(p.lon,p.lat),at); marks.push({x,y,z,o}); }
  marks.sort((a,b)=>a.z-b.z); const dark=theme==='dark', base=R/170, seen=[];
  for(const m of marks){ const front=(m.z+1)/2, sx=cxp+m.x*R, sy=cyp-m.y*R;
    if(!m.o){ ctx.globalAlpha=0.18+front*0.2; ctx.fillStyle=P.dim; ctx.fillRect(sx-0.6*base,sy-0.6*base,1.2*base,1.2*base); continue; }
    const age=Math.min(1,(at-m.o.t)/120); const lum=(m.o.r*0.299+m.o.g*0.587+m.o.b*0.114)/255, bright=dark?lum:1-lum;
    const sz=(0.5+bright*3.2)*(0.5+front*0.6)*base*(1-age*0.35); ctx.globalAlpha=(0.3+front*0.7)*(1-age*0.6); ctx.fillStyle=`rgb(${m.o.r},${m.o.g},${m.o.b})`;
    if(sz<1.3) ctx.fillRect(sx-sz,sy-sz,sz*2,sz*2); else { ctx.beginPath(); ctx.arc(sx,sy,sz,0,7); ctx.fill(); }
    if(m.o.au>0.12&&front>0.5){ ctx.strokeStyle=P.warm; ctx.lineWidth=0.8*base; ctx.globalAlpha=Math.min(1,m.o.au*1.4)*(1-age*0.6); ctx.beginPath(); ctx.arc(sx,sy,sz+(1.2+m.o.au*4)*base,0,7); ctx.stroke(); } }  // the halo: how loud it was when this was seen
  ctx.globalAlpha=1;
  // the live frustum: the part of the orb the camera is writing to right now
  if(cursor==null&&(hearing||sim)){ const f=gotOri?fwd:aimFwd; const lam=Math.atan2(f[0],f[2]), phi=Math.asin(Math.max(-1,Math.min(1,f[1]))); const [x,y,z]=proj(phi,lam); if(z>-0.2){ ctx.strokeStyle=P.warm; ctx.lineWidth=1.2; ctx.globalAlpha=0.9; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.ellipse(cxp+x*R,cyp-y*R,R*0.30*Math.max(0.2,z),R*0.17*Math.max(0.2,z),0,0,7); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1; } }
  if(picked!=null) drawPick(cxp,cyp,R);
  if(STATE==='READING'){ const upA=Math.max(0,Math.min(1,-dragY/60)), dn=Math.max(0,Math.min(1,dragY/60)); chevron(cxp,cyp-R-22,-1,Math.max(0.4,upA),tiny()?'':'KEEP'); chevron(cxp,cyp+R+22,1,Math.max(0.4,dn),tiny()?'':'LET GO'); }
}
function chevron(cxp,y,dir,alpha,label){ ctx.globalAlpha=alpha; ctx.fillStyle=`rgb(${P.ink})`; for(let i=-4;i<=4;i++){ ctx.beginPath(); ctx.arc(cxp+i*6,y-Math.abs(i)*4*dir,1.4,0,7); ctx.fill(); } if(label){ const tmp=document.createElement('div'); const c=dotText(tmp,label,{size:0.9,max:200}); const d=Math.min(2,devicePixelRatio||1); ctx.drawImage(c,cxp-c.width/d/2,dir<0?y-22-c.height/d:y+24,c.width/d,c.height/d); } ctx.globalAlpha=1; }

/* ---------- the strip: the session's sound and motion, and the cursor ---------- */
const strip=$('strip'), sg=strip.getContext('2d');
function drawStrip(){ const w=strip.clientWidth, h=strip.clientHeight; if(!w) return; const d=Math.min(2,devicePixelRatio||1); if(strip.width!==Math.round(w*d)){ strip.width=Math.round(w*d); strip.height=Math.round(h*d); } sg.setTransform(d,0,0,d,0,0); sg.clearRect(0,0,w,h);
  const span=Math.min(Ring.count,SN); if(!span) return; const step=Math.max(1,Math.round(span/(w/3.6)));
  for(let i=0;i<span;i+=step){ let a=0,m=0; for(let k=i;k<Math.min(span,i+step);k++){ const s=Ring.at(span-1-k); a=Math.max(a,s.au); m=Math.max(m,s.mo); } const x=(i+step/2)/span*w; const rows=Math.max(1,Math.round(a*(h/2/4))); sg.fillStyle=`rgba(${P.ink},0.85)`; for(let q=0;q<rows;q++){ sg.beginPath(); sg.arc(x,h/2-2-q*4,1.2,0,7); sg.fill(); } const rows2=Math.max(0,Math.round(m*(h/2/4))); sg.fillStyle=`rgb(${P.ember})`; for(let q=0;q<rows2;q++){ sg.beginPath(); sg.arc(x,h/2+2+q*4,1.2,0,7); sg.fill(); } }
  const at=cursor==null?now:cursor; const t0=Ring.at(span-1).t, t1=Ring.at(0).t; const u=t1>t0?Math.max(0,Math.min(1,(at-t0)/(t1-t0))):1; sg.fillStyle=P.warm; for(let y=2;y<h;y+=4){ sg.beginPath(); sg.arc(u*w,y,1.3,0,7); sg.fill(); }
  const tmp=document.createElement('div'); const lab=dotText(tmp,(cursor==null?'NOW':'-'+Math.round(now-cursor)+'S')+'  '+Math.round(Math.min(SESSION,span/HZ))+'S HELD',{size:0.75,color:P.dim,max:200}); sg.drawImage(lab,w-lab.width/d-2,h-lab.height/d-1,lab.width/d,lab.height/d); }
let stripDrag=false; strip.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); stripDrag=true; strip.setPointerCapture(ev.pointerId); stripTo(ev); }); strip.addEventListener('pointermove',ev=>{ if(stripDrag) stripTo(ev); }); strip.addEventListener('pointerup',()=>{ stripDrag=false; }); strip.addEventListener('pointercancel',()=>{ stripDrag=false; });
function stripTo(ev){ const r=strip.getBoundingClientRect(); const u=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)); const span=Math.min(Ring.count,SN); if(!span) return; const t0=Ring.at(span-1).t, t1=Ring.at(0).t; const t=t0+(t1-t0)*u; if(u>0.985){ cursor=null; if(STATE==='PAST') setState('LIVE'); } else { cursor=t; if(STATE==='LIVE') setState('PAST'); } status(); }

/* ---------- deep: open the stack under a dot ---------- */
let picked=null;
function pick(px,py){ const R=orbR(), cxp=W/2, cyp=orbY(); let best=null,bd=14; for(const p of pts){ const [x,y,z]=proj(p.lat,p.lon); if(z<0) continue; const d=Math.hypot(cxp+x*R-px,cyp-y*R-py); if(d<bd){ bd=d; best=p; } } return best; }
function drawPick(cxp,cyp,R){ const [x,y]=proj(picked.lat,picked.lon); ctx.strokeStyle=P.warm; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(cxp+x*R,cyp-y*R,7,0,7); ctx.stroke(); }
function openPick(p){ picked=p; const st=Cell.stack(cellOf(p.lon,p.lat)); panel.innerHTML=''; panel.classList.add('on');
  const head=document.createElement('div'); dotText(head,`${Math.round(p.lon*180/Math.PI)}  ${Math.round(p.lat*180/Math.PI)}  ${st.length?st.length+' TIMES SEEN':'NEVER SEEN'}`,{size:0.95,color:P.dim,max:W-44}); panel.appendChild(head);
  for(const o of st){ const row=document.createElement('div'); row.className='obs'; const sw=document.createElement('canvas'); sw.width=sw.height=28; const g=sw.getContext('2d'); const lum=(o.r*0.299+o.g*0.587+o.b*0.114)/255; g.fillStyle=`rgb(${o.r},${o.g},${o.b})`; g.beginPath(); g.arc(14,14,3+lum*9,0,7); g.fill(); if(o.au>0.12){ g.strokeStyle=P.warm; g.beginPath(); g.arc(14,14,9+o.au*4,0,7); g.stroke(); }
    const txt=document.createElement('div'); dotText(txt,`${hms(new Date(Date.now()-(now-o.t)*1000))}  ${Math.round(now-o.t)}S AGO  SOUND ${Math.round(o.au*100)}  MOTION ${Math.round(o.mo*100)}`,{size:0.8,max:W-100}); row.append(sw,txt); row.onclick=ev=>{ ev.stopPropagation(); cursor=o.t; setState('PAST'); status(); }; panel.appendChild(row); }
  const x=document.createElement('button'); x.className='x'; dotText(x,'X',{size:1.0}); x.onclick=ev=>{ ev.stopPropagation(); closePick(); }; panel.appendChild(x); say(st.length?'each line is one time this direction was seen. tap one to go there':''); }
function closePick(){ picked=null; panel.classList.remove('on'); panel.innerHTML=''; }

/* ---------- keep: the whole field with its stacks, the ring, the tape, the fixes ---------- */
const kept=[];
function keepField(){ if(!Cell.seen()){ say('nothing seen yet'); return; } const at=cursor==null?now:cursor; const c=document.createElement('canvas'); c.width=TW; c.height=TH; const g=c.getContext('2d'); const id=g.createImageData(TW,TH); const age=new Float32Array(TN), au=new Float32Array(TN); let seen=0;
  for(let i=0;i<TN;i++){ const o=Cell.latest(i,at); if(!o) continue; seen++; id.data[i*4]=o.r; id.data[i*4+1]=o.g; id.data[i*4+2]=o.b; id.data[i*4+3]=255; age[i]=at-o.t; au[i]=o.au; } g.putImageData(id,0,0);
  const spanS=Math.min(SESSION,Ring.count/HZ); const wav=(Tape.ring&&micOK)?Tape.wav(Tape.cut(Math.max(0,now-at),Math.max(0,now-at)+Math.min(spanS,60))):null;
  const m={id:String(Date.now()),name:'field '+hms(new Date()),at:Date.now(),pic:c.toDataURL('image/jpeg',0.85),seen:seen/TN,age:Array.from(age,v=>+v.toFixed(1)),au:Array.from(au,v=>+v.toFixed(2)),ring:{hz:HZ,au:Array.from({length:Math.min(Ring.count,SN)},(_,k)=>+Ring.at(Math.min(Ring.count,SN)-1-k).au.toFixed(3)),mo:Array.from({length:Math.min(Ring.count,SN)},(_,k)=>+Ring.at(Math.min(Ring.count,SN)-1-k).mo.toFixed(3))},fixes:fixes.slice(-300),wav};
  kept.push(m); Haptic([18,90,18]); say('kept the field. '+Math.round(m.seen*100)+'% of the room, '+Math.round(spanS)+'s of sound');
  const row=document.createElement('div'); row.className='k'; const im=new Image(); im.src=m.pic; row.appendChild(im); const lab=document.createElement('div'); dotText(lab,hms(new Date(m.at)),{size:0.8,color:P.dim,max:80}); row.appendChild(lab); row.onclick=ev=>{ ev.stopPropagation(); exportMenu(m); }; $('shelf').appendChild(row); }
function exportMenu(m){ panel.innerHTML=''; panel.classList.add('on'); const h=document.createElement('div'); dotText(h,`${m.name}  ${Math.round(m.seen*100)}% SEEN`,{size:0.95,max:W-44}); panel.appendChild(h); const acts=document.createElement('div'); acts.className='acts';
  const mk=(l,fn)=>{ const b=document.createElement('button'); dotText(b,l,{size:1.0}); b.onclick=ev=>{ ev.stopPropagation(); fn(b); }; acts.appendChild(b); };
  mk('360 PLATE',()=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=2048; c.height=1024; const g=c.getContext('2d'); g.fillStyle=P.paper; g.fillRect(0,0,2048,1024); const t=document.createElement('canvas'); t.width=TW; t.height=TH; const tg=t.getContext('2d',{willReadFrequently:true}); tg.drawImage(im,0,0); const d=tg.getImageData(0,0,TW,TH).data; const cw=2048/TW; for(let y=0;y<TH;y++) for(let x=0;x<TW;x++){ const i=y*TW+x; if(m.age[i]==null||(!d[i*4]&&!d[i*4+1]&&!d[i*4+2]&&!m.au[i])) continue; const lum=(d[i*4]*0.299+d[i*4+1]*0.587+d[i*4+2]*0.114)/255; g.fillStyle=`rgb(${d[i*4]},${d[i*4+1]},${d[i*4+2]})`; g.beginPath(); g.arc((x+0.5)*cw,(y+0.5)*cw,cw*(0.12+0.4*(theme==='dark'?lum:1-lum)),0,7); g.fill(); if(m.au[i]>0.12){ g.strokeStyle=P.warm; g.lineWidth=1; g.beginPath(); g.arc((x+0.5)*cw,(y+0.5)*cw,cw*0.55+m.au[i]*3,0,7); g.stroke(); } } c.toBlob(b=>deliver(new File([b],'present-deep-'+m.id+'.png',{type:'image/png'}),m),'image/png'); }; im.src=m.pic; });
  mk('PLY',()=>{ const im=new Image(); im.onload=()=>{ const t=document.createElement('canvas'); t.width=TW; t.height=TH; const tg=t.getContext('2d',{willReadFrequently:true}); tg.drawImage(im,0,0); const d=tg.getImageData(0,0,TW,TH).data; const rows=[]; for(let i=0;i<TN;i++){ if(!d[i*4]&&!d[i*4+1]&&!d[i*4+2]&&!m.au[i]) continue; const r=1-Math.min(1,m.age[i]/120)*0.45; rows.push(`${(TDIR[i*3]*r).toFixed(4)} ${(TDIR[i*3+1]*r).toFixed(4)} ${(TDIR[i*3+2]*r).toFixed(4)} ${d[i*4]} ${d[i*4+1]} ${d[i*4+2]} ${m.age[i]} ${m.au[i]}`); } const ply='ply\nformat ascii 1.0\ncomment ambient present deep. radius = 1 - 0.45*min(1,age/120)\nelement vertex '+rows.length+'\nproperty float x\nproperty float y\nproperty float z\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nproperty float age_s\nproperty float sound\nend_header\n'+rows.join('\n')+'\n'; deliver(new File([ply],'present-deep-'+m.id+'.ply',{type:'text/plain'}),m); }; im.src=m.pic; });
  mk('DATA',()=>deliver(new File([JSON.stringify({name:m.name,at:new Date(m.at).toISOString(),seen:m.seen,cells:[TW,TH],age_s:m.age,sound:m.au,ring:m.ring,fixes:m.fixes})],'present-deep-'+m.id+'.json',{type:'application/json'}),m));
  if(m.wav) mk('SOUND',()=>deliver(new File([m.wav],'present-deep-'+m.id+'.wav',{type:'audio/wav'}),m));
  mk('X',()=>{ panel.classList.remove('on'); panel.innerHTML=''; }); panel.appendChild(acts); }
async function deliver(file,m){ const data={files:[file],title:m.name}; if(navigator.share&&navigator.canShare&&navigator.canShare(data)){ try{ await navigator.share(data); return; }catch(e){ if(e.name==='AbortError') return; } } say('saved to your downloads: '+file.name); const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); }

/* ---------- the loop ---------- */
let last=performance.now(), sliceClock=0, dragY=0, intro=0;
function frame(ts){ try{ const dt=Math.min(100,ts-last); last=ts; now=ts/1000;
  let ae=0; if(analyser&&abuf){ analyser.getByteTimeDomainData(abuf); let s=0; for(let i=0;i<abuf.length;i++){ const v=(abuf[i]-128)/128; s+=v*v; } ae=Math.min(1,Math.sqrt(s/abuf.length)*5); } else if(sim) ae=0.1+0.5*Math.abs(Math.sin(now*1.3))*Math.random(); curAudio=Math.max(curAudio*0.85,ae);
  if((hearing||sim)&&STATE!=='READING'){ sliceClock+=dt; while(sliceClock>=1000/HZ){ sliceClock-=1000/HZ; const f=Frames.grab(); if(f){ curMotion=f.mo; paintFrame(f.img,f.mo); } Ring.push(curAudio,curMotion,now); } }
  if(STATE==='READING'&&!p0) dragY*=Math.pow(0.001,dt/400);
  if(intro<1&&!reduceMotion){ intro+=dt/2400; rot=(1-intro)*Math.PI*2*0.6; } drawOrb(); if(!tiny()) drawStrip();
  if(STATE==='LIVE'||STATE==='PAST') sysWord((cursor==null?'LIVE ':'BACK ')+Math.round(Cell.seen()*100)+'%');
 }catch(e){ say('<span class="err">drawing broke</span>\nit is still recording'); } requestAnimationFrame(frame); }

/* ---------- gestures: drag turns (or aims), tap a dot opens its stack, swipe up keeps ---------- */
let p0=null,pLast=null,moved=false;
cv.addEventListener('pointerdown',ev=>{ ensureCtx().catch(()=>{}); if(STATE==='INTRO'){ intro=1; setState('ASK'); return; } if(STATE==='ASK'||STATE==='FAULT'){ start(); return; } p0={x:ev.clientX,y:ev.clientY}; pLast={x:ev.clientX,y:ev.clientY}; moved=false; cv.setPointerCapture(ev.pointerId); });
cv.addEventListener('pointermove',ev=>{ if(!p0) return; const dx=ev.clientX-pLast.x, dy=ev.clientY-pLast.y; pLast={x:ev.clientX,y:ev.clientY}; if(Math.hypot(ev.clientX-p0.x,ev.clientY-p0.y)>8) moved=true; if(STATE==='READING'){ dragY=ev.clientY-p0.y; return; } if(!moved) return;
  if(!gotOri&&(hearing||sim)&&Math.abs(dx)+Math.abs(dy)>0&&ev.shiftKey===false&&aimMode){ const lam=Math.atan2(aimFwd[0],aimFwd[2])+dx*0.005, phi=Math.max(-1.4,Math.min(1.4,Math.asin(aimFwd[1])-dy*0.005)); aimFwd=[Math.cos(phi)*Math.sin(lam),Math.sin(phi),Math.cos(phi)*Math.cos(lam)]; } else { rot-=dx/orbR(); tilt=Math.max(-1.2,Math.min(1.2,tilt+dy/orbR())); } });
let aimMode=false;
cv.addEventListener('pointerup',ev=>{ if(!p0) return; const dy=ev.clientY-p0.y, dx=ev.clientX-p0.x;
  if(STATE==='READING'){ if(dy<-60&&Math.abs(dy)>Math.abs(dx)){ keepField(); setState(cursor==null?'LIVE':'PAST'); } else if(dy>60&&Math.abs(dy)>Math.abs(dx)){ setState(cursor==null?'LIVE':'PAST'); say('let go'); } p0=null; return; }
  if(!moved){ if(picked!=null){ closePick(); } const p=pick(ev.clientX,ev.clientY); if(p){ Haptic(6); openPick(p); } else if(Math.hypot(ev.clientX-W/2,ev.clientY-orbY())<orbR()*1.15){ /* a tap on the orb, off any dot */ } else if((hearing||sim)&&!panel.classList.contains('on')){ setState('READING'); firstTaps++; try{localStorage.setItem('ap.taps',firstTaps);}catch(e){} say('drag the orb up to keep the field\nor down to let it be'); } }
  p0=null; });
cv.addEventListener('pointercancel',()=>{ p0=null; });
$('s-cam').addEventListener('click',ev=>{ ev.stopPropagation(); if(hearing){ facing=facing==='user'?'environment':'user'; Frames.prev=null; start(); } else start(); });
$('s-ori').addEventListener('click',ev=>{ ev.stopPropagation(); if(gotOri) say('the frame paints where the phone points'); else { aimMode=!aimMode; say(aimMode?'drag on the orb moves the aim':(oriWhy||'asking for motion')); if(!oriWhy) sensors(); } });
$('s-gps').addEventListener('click',ev=>{ ev.stopPropagation(); say(fixes.length?('position '+fixes[fixes.length-1].lat.toFixed(5)+' '+fixes[fixes.length-1].lon.toFixed(5)+'  '+fixes.length+' fixes'):(gpsWhy||'asking')); });
$('s-now').addEventListener('click',ev=>{ ev.stopPropagation(); cursor=null; if(STATE==='PAST') setState('LIVE'); status(); });
$('s-theme').addEventListener('click',ev=>{ ev.stopPropagation(); theme=theme==='dark'?'light':'dark'; applyTheme(); status(); dotText($('title'),'AMBIENT PRESENT DEEP',{size:1.2,align:'left'}); });
addEventListener('keydown',ev=>{ if(ev.key==='ArrowLeft'){ cursor=(cursor==null?now:cursor)-1; setState('PAST'); status(); } if(ev.key==='ArrowRight'){ cursor=Math.min(now,(cursor==null?now:cursor)+1); if(cursor>=now-0.05){ cursor=null; setState('LIVE'); } status(); } if(ev.key==='Escape'){ closePick(); } if(ev.key==='ArrowUp'&&STATE==='READING') { keepField(); setState('LIVE'); } });
(function title(){ const s='AMBIENT PRESENT DEEP', t=$('title'); let i=0; if(reduceMotion){ dotText(t,s,{size:1.2,align:'left'}); return; } const iv=setInterval(()=>{ dotText(t,s.slice(0,++i),{size:1.2,align:'left'}); if(i>=s.length) clearInterval(iv); },80); })();
status(); setState('INTRO'); setTimeout(()=>{ if(STATE==='INTRO') setState('ASK'); },2600); requestAnimationFrame(frame);
