<style>
:root{ --paper:#0f0e0c; --ink:#ece7d8; --dim:#6e675b; --line:#2a2620; --ember:#e0a24a; --warm:#f2c962; --rust:#c9673a; }
html.light{ --paper:#efe9da; --ink:#2a2620; --dim:#9a9283; --line:#d9d2c1; --ember:#c9843c; --warm:#e0b35a; --rust:#a3512e; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;transition:background .8s,color .8s}
#stage{position:fixed;inset:0;display:block}
button{appearance:none;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;padding:0}
button:focus-visible,[contenteditable]:focus-visible{outline:1px solid var(--ember);outline-offset:3px}
.ui{position:fixed;left:0;right:0;padding:0 20px;font-size:11px;letter-spacing:.2em;line-height:1.9;pointer-events:none}
#top{top:max(16px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start}
#title{white-space:pre;min-height:1.9em}
#sys{display:flex;align-items:center;gap:8px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--dim);transition:background 1.2s}
#below{position:fixed;left:20px;right:20px;top:44%;bottom:118px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;overflow:hidden}
#strip{width:min(100%,340px);height:26px;display:none;pointer-events:auto;touch-action:none}
#strip.on{display:block}
#line{text-align:center;font-size:12px;letter-spacing:.14em;line-height:1.8;pointer-events:auto;white-space:pre-line;transition:opacity .9s;opacity:1;min-height:1.8em}
#line.dimmed{opacity:0}
#line button{text-decoration:underline;text-underline-offset:4px;letter-spacing:.14em}
#line .err{color:var(--rust)}
#panel{display:none;flex-direction:column;width:100%;gap:6px;align-items:center;text-align:center;pointer-events:auto;font-size:12px;letter-spacing:.06em;line-height:1.7}
#panel.on{display:flex;animation:rise .45s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#strip.on{animation:rise .45s ease-out}
#line.swap{opacity:0;transition:opacity .18s}
#panel .name{padding:2px 8px 6px;border-bottom:1px solid var(--line);max-width:100%}
#panel .when{font-size:10px;letter-spacing:.2em;color:var(--dim)}
#panel .text{max-width:36em;color:var(--ink)}
#panel .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:2px;max-width:100%}
#panel .acts button{padding:7px 8px;border:1px solid var(--line);flex:0 1 auto}
#panel .acts button.warn{border-color:var(--rust);color:var(--rust)}
#shelf{position:fixed;left:0;right:0;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 40px);display:flex;gap:14px;overflow-x:auto;padding:6px 20px;pointer-events:auto;scrollbar-width:none;justify-content:flex-start}
#shelf::-webkit-scrollbar{display:none}
#shelf.center{justify-content:center}
#shelf .m:nth-last-child(n+10):not(#memthumb){display:none}
#shelf .m{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.85}
#shelf .m.sel{opacity:1}
#shelf canvas{width:46px;height:46px;display:block}
#shelf .t{font-size:9px;letter-spacing:.12em;color:var(--dim)}
#shelf .m.sel .t{color:var(--ink)}
#status{bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:22px;font-size:10px;color:var(--dim);pointer-events:auto}
#status button{color:var(--dim);letter-spacing:.2em}
#status button.on{color:var(--ink)}
#status button.bad{color:var(--rust)}
@media (max-width:339px),(max-height:339px){ #top,#status,#below,#shelf{display:none!important} }
@media (min-width:700px){ #below{left:50%;right:auto;width:480px;transform:translateX(-50%)} #shelf{justify-content:center} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

<body>
<canvas id="stage" aria-label="the last fifteen seconds of this room as a sphere of marks"></canvas>
<div class="ui" id="top"><div id="title"></div><div id="sys"><div id="sysword"></div><div id="dot"></div></div></div>
<div id="below"><canvas id="strip" aria-label="the last fifteen seconds; drag to move the held window"></canvas><div id="panel" aria-live="polite"></div><div id="line"></div></div>
<div id="shelf" class="center" aria-label="kept moments"></div>
<div class="ui" id="status">
  <button id="s-hear">HEARING OFF</button>
  <button id="s-words">WORDS OFF</button>
  <button id="s-sound">SOUND OFF</button>
  <button id="s-tab" hidden>TAB</button>
  <button id="s-theme">DARK</button>
</div>

<script>
/* ============================================================
   AMBIENT PRESENT  v3
   One sphere. Time is longitude: now at the right limb, older toward the back.
   WORLD -> TRACE (15 s ring of samples + slices) -> { ERASE | MEMORY (a sphere of its own) }
   The program assumes it is broken: every state prints what it is doing and the one thing
   to do next; every failure names its fix; the frame loop survives its own exceptions.
   ============================================================ */
'use strict';
const T_WINDOW=15, HZ=20, N=T_WINDOW*HZ, RINGS=32, HOLD_W=N, MIN_W=HZ, AUTO_DISSOLVE=9000;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ---------- palette (dark default; light on request or system) ---------- */
const PAL = {
  dark: {paper:'#0f0e0c', ink:[236,231,216], dim:'#6e675b', line:'#2a2620', ember:[224,162,74], rust:[201,103,58], warm:'#e0a24a'},
  light:{paper:'#efe9da', ink:[42,38,32],   dim:'#9a9283', line:'#d9d2c1', ember:[224,179,90], rust:[163,81,46],   warm:'#c9843c'}
};
let theme = (localStorage.getItem('ap.theme') || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
let P = PAL[theme];
function applyTheme(){ P=PAL[theme]; document.documentElement.classList.toggle('light', theme==='light'); try{ localStorage.setItem('ap.theme',theme); }catch(e){} }
applyTheme();

/* ---------- temporal model ---------- */
const slices = Array.from({length:N}, ()=>({e:0, tokens:[]}));
let head=0, sliceClock=0, curPeak=0, smoothE=0, frozen=false;
const slice = i => slices[(head - i + N*4) % N];
function pushSlice(e){ const prev=slices[head].e; head=(head+1)%N; const s=slices[head]; s.e=prev*0.6+e*0.4; s.tokens=[]; }

/* ---------- world state ---------- */
// INTRO (assembling) -> ASK (tap the sphere) -> LISTENING/REST <-> RECALL -> WORKING -> READING -> SAVE | DELETE ; FAULT ; STOPPED
let STATE='INTRO', hearing=false, simulate=false, wordsOK=false, wordsWhy='';
let audioCtx=null, analyser=null, buf=null, stream=null;
const dot=$('dot'), line=$('line'), panel=$('panel'), shelf=$('shelf');
const DOTCOL = s => ({INTRO:P.dim, ASK:P.dim, REST:`rgb(${P.ink})`, LISTENING:P.warm, RECALL:P.warm, WORKING:P.warm, READING:P.warm, SAVE:`rgb(${P.ink})`, DELETE:P.dim, FAULT:`rgb(${P.rust})`, STOPPED:P.dim})[s]||P.dim;

const SYSW={INTRO:'',ASK:'OFF',REST:'QUIET',LISTENING:'HEARING',RECALL:'HELD',WORKING:'READING',READING:'READ',SAVE:'KEPT',DELETE:'LET GO',FAULT:'FAULT',STOPPED:'PAUSED'};
function sysWord(s){ const w=$('sysword'); const t=Mem.on?'ALL':(Play.m?'PLAYING':(SYSW[s]||'')); w.dataset.dot='{"size":0.9}'; dotText(w,t,{size:0.9,color:P.dim,max:120}); }
function say(html, cls){ if(Mem.on&&!/<[a-z]/i.test(html)) html=''; if(line.dataset.last===html) return; line.dataset.last=html; line.classList.add('swap'); setTimeout(()=>{ line.className = cls||''; if(/<[a-z]/i.test(html)){ line.innerHTML=html; delete line.dataset.text; } else { line.dataset.dot='{"size":1.15}'; dotText(line, dotWrap(html,34), {size:1.15}); } },180); }
function setState(s){
  const prev=STATE; STATE=s; dot.style.background=DOTCOL(s); sysWord(s);
  switch(s){
    case 'ASK':      say(hearing||simulate ? '' : 'tap the sphere\nso it can hear the room'); break;
    case 'REST':
    case 'LISTENING': say(firstTaps<1 ? 'tap the sphere to look back' : ''); break;
    case 'RECALL':   say('15 seconds held. trim on the strip.\nlet go on the sphere to read'); break;
    case 'WORKING':  say(''); break;
    case 'READING':  say(firstKeeps<2 ? 'drag the sphere up to keep it\nor down to let it go' : ''); break;
    case 'SAVE':     say('kept'); break;
    case 'DELETE':   say('let go'); break;
    case 'FAULT':    break;
    case 'STOPPED':  say('paused\ntap the sphere to listen again'); break;
  }
  if (s!=='READING' && s!=='SAVE' && !Mem.on) closePanel();
  Sonic.onState(s,prev); Haptic.onState(s,prev); Cue.onState(s,prev);
}
let firstTaps = +(localStorage.getItem('ap.taps')||0), firstKeeps = +(localStorage.getItem('ap.keeps')||0);

/* ---------- audio: hear ---------- */
async function ensureCtx(){ if(!audioCtx){ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); Sonic.init(audioCtx); Cue.init(audioCtx); } if(audioCtx.state==='suspended') await audioCtx.resume(); return audioCtx; }
async function startHearing(){
  say('asking for the microphone');
  if (!window.isSecureContext){ fault('the microphone needs an https page', 'open this page over https, or <button data-act="sim">watch a made-up room</button>'); return; }
  if (!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ fault('this browser cannot open a microphone', 'try Safari, Chrome or Firefox, or <button data-act="sim">watch a made-up room</button>'); return; }
  try{
    const ctx=await ensureCtx();
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const src=ctx.createMediaStreamSource(stream);
    analyser=ctx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0.6; src.connect(analyser); buf=new Uint8Array(analyser.fftSize);
    Tape.init(ctx,src);
    const tr=stream.getAudioTracks()[0]; tr.onended=()=>{ hearing=false; status(); fault('hearing stopped', 'tap the sphere to reconnect'); };
    hearing=true; simulate=false; status();
    startSpeech();
    Cue.startup(); Haptic.pulse([10,60,10,60,18]);
    setState('LISTENING');
  }catch(e){
    const n=e&&e.name;
    if (n==='NotAllowedError'||n==='SecurityError') fault('microphone declined', 'allow it in the browser\u2019s site settings (the lock icon by the address), then tap the sphere\nor <button data-act="sim">watch a made-up room</button>');
    else if (n==='NotFoundError') fault('no microphone on this device', '<button data-act="sim">watch a made-up room</button>');
    else if (n==='NotReadableError') fault('another app holds the microphone', 'close it, then tap the sphere');
    else fault('could not start hearing ('+(n||'unknown')+')', 'tap the sphere to try again, or <button data-act="sim">watch a made-up room</button>');
  }
}
function startSim(){ simulate=true; hearing=false; wordsOK=true; wordsWhy='made-up words'; status(); ensureCtx().then(()=>{ Cue.startup(); }).catch(()=>{}); Haptic.pulse([10,60,10,60,18]); setState('LISTENING'); }
function fault(what, fix){ setState('FAULT'); say('<span class="err">'+what+'</span>\n'+(fix||''), ''); faultT=0; }
let faultT=0;
line.addEventListener('click', ev=>{ const b=ev.target.closest('button'); if(!b) return; ev.stopPropagation(); if(b.dataset.act==='sim') startSim(); });

/* ---------- speech: one token, one mark ---------- */
let rec=null, recActive=false, lastFinalAt=performance.now();
function startSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ wordsOK=false; wordsWhy='this browser has no speech-to-text; sound is still kept'; status(); return; }
  try{
    rec=new SR(); rec.continuous=true; rec.interimResults=false; rec.lang=navigator.language||'en-US';
    rec.onresult=ev=>{ for(let i=ev.resultIndex;i<ev.results.length;i++){ const r=ev.results[i]; if(!r.isFinal) continue; placeTokens(r[0].transcript.trim().split(/\s+/).filter(Boolean), performance.now()-lastFinalAt); lastFinalAt=performance.now(); } };
    rec.onstart=()=>{ wordsOK=true; wordsWhy=''; status(); };
    rec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ wordsOK=false; wordsWhy='speech-to-text blocked; sound is still kept'; recActive=false; status(); } if(e.error==='network'){ wordsOK=false; wordsWhy='speech-to-text needs the network; sound is still kept'; status(); } };
    rec.onend=()=>{ if(recActive&&STATE!=='STOPPED') setTimeout(()=>{ try{rec.start();}catch(e){} },400); };
    recActive=true; rec.start();
  }catch(e){ wordsOK=false; wordsWhy='speech-to-text failed to start'; status(); }
}
function placeTokens(words, spanMs){
  const span=Math.min(N-1,Math.max(words.length*4,Math.round(spanMs/1000*HZ))), lag=Math.round(0.6*HZ);
  const voiced=[]; for(let a=lag;a<lag+span&&a<N;a++) if(slice(a).e>0.08) voiced.push(a);
  const pool=voiced.length?voiced:Array.from({length:span},(_,k)=>k+lag);
  words.forEach((w,k)=>{ const a=pool[Math.floor((words.length-1-k)/Math.max(1,words.length-1)*(pool.length-1))]; slice(a).tokens.push(w); });
}
const SIM_WORDS=['did','you','turn','off','the','oven','before','we','left','i','think','so','it','was','fine','she','said','check','again','later'];
let simPhase=0, simTalking=false, simTimer=0, simWordAt=0;

/* ---------- tape: the trace as samples ---------- */
const Tape={ ctx:null,sr:48000,ring:null,pos:0,len:0,
  init(ctx,src){ this.ctx=ctx; this.sr=ctx.sampleRate; this.len=this.sr*T_WINDOW; this.ring=new Float32Array(this.len);
    if(!ctx.createScriptProcessor) return; const Pn=ctx.createScriptProcessor(4096,1,1);
    Pn.onaudioprocess=ev=>{ if(frozen||STATE==='STOPPED') return; const inp=ev.inputBuffer.getChannelData(0); for(let i=0;i<inp.length;i++){ this.ring[this.pos]=inp[i]; this.pos=(this.pos+1)%this.len; } };
    const mute=ctx.createGain(); mute.gain.value=0; src.connect(Pn); Pn.connect(mute); mute.connect(ctx.destination); this.node=Pn; },
  cut(a0,a1){ if(!this.ring) return null; const n=Math.max(0,Math.round((a1-a0)*this.sr)), out=new Float32Array(n); let st=(this.pos-Math.round(a1*this.sr)+this.len*2)%this.len; for(let i=0;i<n;i++) out[i]=this.ring[(st+i)%this.len]; return out; },
  wav(x){ const sr=this.sr,n=x.length,b=new ArrayBuffer(44+n*2),v=new DataView(b),W=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
    W(0,'RIFF');v.setUint32(4,36+n*2,true);W(8,'WAVE');W(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);W(36,'data');v.setUint32(40,n*2,true);
    for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,x[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true);} return new Blob([b],{type:'audio/wav'}); },
  clear(){ if(this.ring) this.ring.fill(0); } };

/* ---------- cues, ambience, haptics ---------- */
const Cue={ ctx:null,out:null,
  init(ctx){ if(this.out) return; this.ctx=ctx; this.out=ctx.createGain(); this.out.gain.value=0.5; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2600; this.out.connect(f); f.connect(ctx.destination); },
  ok(){ return this.ctx&&this.ctx.state==='running'; },
  tone(f,t0,a,h,r,g=0.1,type='sine'){ const o=this.ctx.createOscillator(),gn=this.ctx.createGain(); o.type=type; o.frequency.value=f; gn.gain.value=0; o.connect(gn); gn.connect(this.out); o.start(t0); gn.gain.linearRampToValueAtTime(g,t0+a); gn.gain.setValueAtTime(g,t0+a+h); gn.gain.exponentialRampToValueAtTime(0.0005,t0+a+h+r); o.stop(t0+a+h+r+0.05); },
  startup(){ if(!this.ok()) return; const t=this.ctx.currentTime; this.tone(146.83,t,1.6,1,5,0.1); this.tone(220,t+1.1,1.8,1,5.5,0.08); this.tone(369.99,t+2.4,2,0.8,6,0.06); this.tone(587.33,t+3.6,2.2,0.4,6.5,0.035); },
  tap(){ if(this.ok()){ const t=this.ctx.currentTime; this.tone(880,t,0.005,0.02,0.09,0.08);} },
  tick(){ if(this.ok()){ const t=this.ctx.currentTime; this.tone(1320,t,0.003,0.01,0.05,0.04);} },
  onState(s){ if(!this.ok()) return; const t=this.ctx.currentTime;
    if(s==='RECALL') this.tone(330,t,0.02,0.05,0.5,0.07);
    else if(s==='READING'){ this.tone(440,t,0.01,0.05,0.6,0.07); this.tone(660,t+0.09,0.01,0.05,0.7,0.05); }
    else if(s==='SAVE'){ this.tone(293.66,t,0.02,0.1,1.6,0.09); this.tone(440,t+0.12,0.02,0.1,1.8,0.07); this.tone(587.33,t+0.26,0.03,0.2,2.6,0.06); }
    else if(s==='DELETE'){ this.tone(392,t,0.01,0.05,0.9,0.06); this.tone(261.63,t+0.18,0.02,0.05,1.4,0.05); }
    else if(s==='FAULT') this.tone(196,t,0.02,0.1,0.8,0.05,'triangle');
    else if(s==='STOPPED'){ this.tone(220,t,0.01,0.05,0.5,0.06); this.tone(146.83,t+0.15,0.02,0.1,1.2,0.05); } } };
const Sonic={ on:false,ctx:null,master:null,filter:null,voices:[],timers:[],held:null,
  init(ctx){ if(this.ctx) return; this.ctx=ctx; this.master=ctx.createGain(); this.master.gain.value=0; this.filter=ctx.createBiquadFilter(); this.filter.type='lowpass'; this.filter.frequency.value=520; this.filter.Q.value=0.4; this.filter.connect(this.master); this.master.connect(ctx.destination);
    [[146.83,23.3],[220,31.1],[329.63,37.7],[369.99,43.9],[493.88,53.1]].forEach(([f,p],i)=>{ const g=ctx.createGain(); g.gain.value=0; g.connect(this.filter); const o1=ctx.createOscillator(); o1.type='sine'; o1.frequency.value=f; const o2=ctx.createOscillator(); o2.type='triangle'; o2.frequency.value=f*1.002; const g2=ctx.createGain(); g2.gain.value=0.18; o2.connect(g2); g2.connect(g); o1.connect(g); o1.start(); o2.start(); this.voices.push({g,p,off:i*5.7}); }); },
  swell(v){ const t=this.ctx.currentTime; v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.g.gain.value,t); v.g.gain.linearRampToValueAtTime(0.16,t+6); v.g.gain.linearRampToValueAtTime(0,t+15); },
  schedule(){ this.timers.forEach(clearTimeout); this.timers=[]; this.voices.forEach(v=>{ const loop=()=>{ if(!this.on) return; this.swell(v); this.timers.push(setTimeout(loop,v.p*1000)); }; this.timers.push(setTimeout(loop,v.off*1000)); }); },
  level(s){ return ({REST:0.05,LISTENING:0.08,RECALL:0.09,WORKING:0.09,READING:0.09,SAVE:0.08,DELETE:0.03,FAULT:0.02,STOPPED:0})[s]??0.05; },
  setOn(on){ this.on=on; if(!this.ctx) return; const t=this.ctx.currentTime; this.master.gain.cancelScheduledValues(t); this.master.gain.setValueAtTime(this.master.gain.value,t); this.master.gain.linearRampToValueAtTime(on?this.level(STATE):0,t+3); if(on) this.schedule(); else this.timers.forEach(clearTimeout); },

/* ---------- clip: a square video of the moment's sphere playing, with its sound ---------- */

    const oc=document.createElement('canvas'); oc.width=oc.height=720; const og=oc.getContext('2d');
    const vs=oc.captureStream(30), dest=ctx.createMediaStreamDestination(); let src=null;

  if(tiny()&&kept.length){ const rr=R0*1.22; kept.slice(-24).forEach((m,i,arr)=>{ const a=-Math.PI/2+i/arr.length*Math.PI*2; ctx.fillStyle=Play.m===m?P.warm:`rgb(${(m.energy||0)>0.45?P.rust:P.ember})`; ctx.globalAlpha=Play.m===m?1:0.7; ctx.beginPath(); ctx.arc(W/2+Math.cos(a)*rr, orbY()+Math.sin(a)*rr, Play.m===m?3:2.2,0,7); ctx.fill(); }); ctx.globalAlpha=1; }
  if(STATE==='READING'){ const up=Math.max(0,Math.min(1,-dragY/60)), dn=Math.max(0,Math.min(1,dragY/60)); const base=0.35+0.15*Math.sin(performance.now()/500);
    chevron(W/2, orbY()-R0-22, -1, Math.max(base,up), tiny()?'':'KEEP'); chevron(W/2, orbY()+R0+22, 1, Math.max(base,dn), tiny()?'':'LET GO'); }
  marks.sort((a,b)=>a.z-b.z);
  const dimAll = Mem.on?1 : STATE==='STOPPED'?0.25 : STATE==='ASK'?0.55 : 1;
  for(const m of marks){
    const front=(m.z+1)/2; let alpha=(0.22+front*0.7)*dimAll;
    if(sel.held&&!Play.m&&!m.selected) alpha*=0.5;
    let oy=0,ox=0; if(dissolve>0){ if(drift(m.id,1)<dissolve*1.1) continue; alpha*=(1-dissolve*0.6); oy=dissolve*dissolve*40*(0.5+drift(m.id,2)); ox=(drift(m.id,3)-0.5)*dissolve*18; }
    let size=(0.9+m.density*2.6)*(0.55+front*0.6)*(R/170); if(m.token) size*=1.8; if(m.selected) size*=1.2;
    ctx.globalAlpha=Math.min(1,alpha*Math.min(1,m.density*2+0.15));
    ctx.fillStyle=m.m?(m.density>0.2?`rgb(${(m.m.energy||0)>0.45?P.rust:P.ember})`:P.dim):(m.token?`rgb(${P.ink})`:(Play.m&&m.selected?P.warm:col(m.age,m.density)));
    ctx.beginPath(); ctx.arc(cxp+m.x*R+ox,cyp-m.y*R+oy,size,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  if(sel.held&&!Play.m){ ctx.strokeStyle=`rgb(${P.ink})`; ctx.lineWidth=1; ctx.setLineDash([2,5]); for(const a of [sel.start,sel.start+sel.w]) meridian(a,cxp,cyp,R); ctx.setLineDash([]); }
  if(Play.m){ ctx.strokeStyle=P.warm; ctx.lineWidth=1.5; meridian(0,cxp,cyp,R); }
  if(STATE==='WORKING'&&!reduceMotion){ ctx.strokeStyle=`rgb(${P.ink})`; ctx.lineWidth=1; ctx.globalAlpha=0.35; for(let k=1;k<7;k++){ ctx.beginPath(); ctx.arc(cxp,cyp,R*(1-convergence*0.7)*k/7,0,7); ctx.stroke(); } ctx.globalAlpha=1; }
}
function meridian(ageS,cxp,cyp,R){ const d=(frozen||Play.m)?0:(sliceClock/(1000/HZ))/N*Math.PI*2, lon=ageS/N*Math.PI*2-d;
  for(const pass of [0,1]){ ctx.globalAlpha=pass?1:0.25; ctx.beginPath(); let open=false;
    for(let k=0;k<=48;k++){ const lat=-Math.PI/2+k/48*Math.PI; const cx=Math.cos(lat)*Math.cos(lon), cz=Math.cos(lat)*Math.sin(lon); const x=cx*Math.cos(TILT)-cz*Math.sin(TILT), z=cx*Math.sin(TILT)+cz*Math.cos(TILT); const px=cxp+x*R, py=cyp-Math.sin(lat)*R;
      const vis = pass ? z>=0 : z<0; if(!vis){ open=false; continue; } if(!open){ ctx.moveTo(px,py); open=true; } else ctx.lineTo(px,py); }
    ctx.stroke(); }
  ctx.globalAlpha=1; }

/* ---------- loop (survives its own errors) ---------- */
let last=performance.now(), errCount=0;
function frame(now){
  try{
    const dt=Math.min(100,now-last); last=now;
    if(!intro.done){ intro.t+=dt/1000; if(intro.t>2.4+RINGS*0.07+0.6){ intro.done=true; if(STATE==='INTRO') setState('ASK'); } }
    let e=0;
    if(hearing&&analyser){ analyser.getByteTimeDomainData(buf); let sum=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; sum+=v*v; } e=Math.min(1,Math.sqrt(sum/buf.length)*5); }
    else if(simulate){ simTimer-=dt; if(simTimer<=0){ simTalking=!simTalking; simTimer=simTalking?1800+Math.random()*3200:1500+Math.random()*5000; } simPhase+=dt*0.015; e=simTalking?0.2+0.45*Math.abs(Math.sin(simPhase))*(0.6+0.4*Math.random()):0.015*Math.random(); }
    curPeak=Math.max(curPeak,e); smoothE+=(e-smoothE)*(dt/900); Sonic.room(smoothE);
    const live = (hearing||simulate) && !frozen && STATE!=='STOPPED' && STATE!=='INTRO' && STATE!=='ASK';
    if(live){ sliceClock+=dt; while(sliceClock>=1000/HZ){ sliceClock-=1000/HZ; pushSlice(curPeak); curPeak=0; if(simulate&&simTalking&&Math.random()<0.5) slice(0).tokens.push(SIM_WORDS[simWordAt++%SIM_WORDS.length]); } }
    if(STATE==='REST'||STATE==='LISTENING'){ let r=0; for(let a=0;a<HZ*4;a++) r+=slice(a).e; r/=HZ*4; if(STATE==='REST'&&r>0.07) setState('LISTENING'); else if(STATE==='LISTENING'&&r<0.025) setState('REST'); }
    if(STATE==='WORKING'){ convergence=Math.min(1,convergence+dt/(reduceMotion?300:1100)); if(convergence>=1) finishWorking(); }
    let dissolve=0;
    if(STATE==='DELETE'){ dissolveT+=dt; dissolve=Math.min(1,dissolveT/(reduceMotion?400:1800)); if(dissolve>=1) afterDissolve(); }
    if(STATE==='FAULT'){ faultT+=dt; dissolve=Math.min(0.6,faultT/1800); if(faultT>4500){ frozen=false; sel.held=false; resolved=null; if(hearing||simulate) setState('LISTENING'); else { STATE='ASK'; dot.style.background=DOTCOL('ASK'); } } }
    if(STATE==='READING'&&!p0) dragY*=Math.pow(0.001,dt/400); if(STATE==='SAVE') flyT+=dt/1000; else flyT=0;
    draw(buildScore(),dissolve); drawStrip();
    errCount=0;
  }catch(err){ errCount++; if(errCount===1) say('<span class="err">something broke in the drawing</span>\nit is still listening; reload if this stays'); if(errCount>600){ frozen=false; sel.held=false; resolved=null; STATE=hearing||simulate?'LISTENING':'ASK'; errCount=0; } }
  requestAnimationFrame(frame);
}

/* ---------- gestures ---------- */
let p0=null,pLast=null,moved=false,holdTimer=0,longPressed=false;
function onSphere(x,y){ return Math.hypot(x-W/2,y-orbY())<orbR()*1.12; }
function ringPick(x,y){ if(!tiny()||!kept.length) return null; const rr=orbR()*1.22, arr=kept.slice(-24); let best=null,bd=14; arr.forEach((m,i)=>{ const a=-Math.PI/2+i/arr.length*Math.PI*2; const d=Math.hypot(x-(W/2+Math.cos(a)*rr), y-(orbY()+Math.sin(a)*rr)); if(d<bd){ bd=d; best=m; } }); return best; }
cv.addEventListener('pointerdown', ev=>{
  ensureCtx().catch(()=>{});
  if(tiny()&&!Play.m&&(STATE==='LISTENING'||STATE==='REST')){ const rm=ringPick(ev.clientX,ev.clientY); if(rm){ Cue.tap(); Haptic.pulse(6); openMoment(rm); Play.open(rm).then(()=>ensureCtx()).then(()=>{ if(Play.m===rm){ Play.start(); sysWord(STATE); } }).catch(()=>{}); return; } }
  if(Mem.on){ p0={x:ev.clientX,y:ev.clientY}; pLast={x:ev.clientX,y:ev.clientY}; moved=false; cv.setPointerCapture(ev.pointerId); return; }
  if(STATE==='INTRO'){ intro.t=99; return; }
  if(STATE==='ASK'){ if(onSphere(ev.clientX,ev.clientY)) startHearing(); return; }
  if(STATE==='FAULT'){ if(hearing||simulate){ faultT=1e9; } else if(onSphere(ev.clientX,ev.clientY)) startHearing(); return; }
  if(STATE==='STOPPED'){ if(onSphere(ev.clientX,ev.clientY)) toggleStop(); return; }
  p0={x:ev.clientX,y:ev.clientY}; pLast={x:ev.clientX,y:ev.clientY}; moved=false; longPressed=false; cv.setPointerCapture(ev.pointerId);
  if(Play.m){ scrubWas=Play.playing; return; }
  clearTimeout(holdTimer); holdTimer=setTimeout(()=>{ if(!moved){ longPressed=true; toggleStop(); } },900);
  Cue.tap(); Haptic.pulse(6);
  if((STATE==='LISTENING'||STATE==='REST')){ if(panel.classList.contains('on')){ closePanel(); clearTimeout(holdTimer); p0=null; return; } lastTickSec=0; firstTaps++; try{localStorage.setItem('ap.taps',firstTaps);}catch(e){} select(); }
});
cv.addEventListener('pointermove', ev=>{ if(!p0) return; const dx=ev.clientX-pLast.x; pLast={x:ev.clientX,y:ev.clientY}; if(Math.hypot(ev.clientX-p0.x,ev.clientY-p0.y)>8){ moved=true; clearTimeout(holdTimer); } if(Mem.on){ Mem.rot+=dx/orbR()*1.2; return; } if(Play.m){ if(moved){ if(Play.playing) Play.pause(); Play.off=Math.max(0,Math.min(Play.dur(),Play.off+dx/(orbR()*2)*Play.dur())); } return; } if(STATE==='RECALL') moveSelection(dx); if(STATE==='READING'){ dragY=ev.clientY-p0.y; } });
let scrubWas=false;
cv.addEventListener('pointerup', ev=>{ clearTimeout(holdTimer); if(Mem.on&&p0){ if(!moved){ const m=Mem.pick(ev.clientX,ev.clientY); if(m){ Cue.tap(); Haptic.pulse(6); Mem.on=false; const i=$('memq'); if(i) i.remove(); if(Mem.thumb) Mem.thumb.classList.remove('sel'); openMoment(m); } else if(!onSphere(ev.clientX,ev.clientY)) Mem.close(); } p0=null; return; } if(Play.m&&p0){ if(moved){ if(scrubWas) Play.start(); } else { if(onSphere(ev.clientX,ev.clientY)) ensureCtx().then(()=>Play.toggle()); else closePanel(); } p0=null; return; } if(!p0||longPressed){ p0=null; return; } const dy=ev.clientY-p0.y, dx=ev.clientX-p0.x;
  if(STATE==='RECALL') resolve(); else if(STATE==='READING'){ if(dy<-60&&Math.abs(dy)>Math.abs(dx)) keep(); else if(dy>60&&Math.abs(dy)>Math.abs(dx)) dissolveMoment(); } p0=null; });
cv.addEventListener('pointercancel',()=>{ clearTimeout(holdTimer); p0=null; });
addEventListener('keydown', ev=>{ if(ev.target.isContentEditable) return; if(STATE==='ASK'&&(ev.key===' '||ev.key==='Enter')) startHearing(); else if(ev.key===' '&&(STATE==='LISTENING'||STATE==='REST')) select(); else if(ev.key===' '&&STATE==='RECALL') resolve(); else if(ev.key==='ArrowLeft'&&STATE==='RECALL') moveSelection(-40); else if(ev.key==='ArrowRight'&&STATE==='RECALL') moveSelection(40); else if(ev.key==='ArrowUp'&&STATE==='READING') keep(); else if(ev.key==='ArrowDown'&&STATE==='READING') dissolveMoment(); else if(ev.key==='Escape') closePanel(); });
document.addEventListener('visibilitychange',()=>{ if(!Sonic.ctx) return; if(document.hidden&&Sonic.on) Sonic.ctx.suspend(); else if(Sonic.on) Sonic.ctx.resume(); });

/* ---------- title: one line, letter by letter, while the sphere assembles ---------- */
(function title(){ const s='AMBIENT PRESENT', t=$('title'); t.dataset.dot='{"size":1.6,"align":"left"}'; let i=0; if(reduceMotion){ dotText(t,s,{size:1.2,align:'left'}); return; } const iv=setInterval(()=>{ dotText(t,s.slice(0,++i),{size:1.2,align:'left'}); if(i>=s.length) clearInterval(iv); },90); })();

/* ---------- install manifest (runtime blob) ---------- */
(function manifest(){ try{ const icon=n=>{ const c=document.createElement('canvas'); c.width=c.height=n; const g=c.getContext('2d'); g.fillStyle='#0f0e0c'; g.fillRect(0,0,n,n); g.fillStyle='#ece7d8'; for(let i=0;i<8;i++){ const a=i/8*Math.PI*2-Math.PI/2; g.beginPath(); g.arc(n/2+Math.cos(a)*n*0.34,n/2+Math.sin(a)*n*0.34,n*0.04,0,7); g.fill(); } g.fillStyle='#e0a24a'; g.beginPath(); g.arc(n*0.69,n*0.375,n*0.062,0,7); g.fill(); return c.toDataURL('image/png'); };
  const m={name:'Ambient Present',short_name:'Present',start_url:location.href.split('#')[0],display:'standalone',background_color:'#0f0e0c',theme_color:'#0f0e0c',description:'A smaller past, a brighter present.',icons:[{src:icon(192),sizes:'192x192',type:'image/png'},{src:icon(512),sizes:'512x512',type:'image/png'}]};
  const l=document.createElement('link'); l.rel='manifest'; l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})); document.head.appendChild(l); }catch(e){} })();

/* ---------- start ---------- */
status();
DB.open().then(()=>DB.all()).then(list=>{ list.sort((a,b)=>a.start-b.start).forEach(m=>{ kept.push(m); Shelf.add(m,false); }); }).catch(()=>{ say('<span class="err">storage is unavailable</span>\nkept moments will last until you close the page'); });
if(intro.done) setState('ASK'); else setState('INTRO');
requestAnimationFrame(frame);
</script>
