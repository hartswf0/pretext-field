<style>
:root{ --paper:#0f0e0c; --ink:#ece7d8; --dim:#6e675b; --line:#2a2620; --ember:#e0a24a; --warm:#f2c962; --rust:#c9673a; }
html.light{ --paper:#efe9da; --ink:#2a2620; --dim:#9a9283; --line:#d9d2c1; --ember:#c9843c; --warm:#e0b35a; --rust:#a3512e; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;transition:background .8s,color .8s}
#stage{position:fixed;inset:0;display:block}
button{appearance:none;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;padding:0}
button:focus-visible,[contenteditable]:focus-visible{outline:1px solid var(--ember);outline-offset:3px}
.ui{position:fixed;left:0;right:0;padding:0 20px;font-size:11px;letter-spacing:.2em;line-height:1.9;pointer-events:none}
#top{top:max(16px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start}
#title{white-space:pre;min-height:1.9em}
#sys{display:flex;align-items:center;gap:8px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--dim);transition:background 1.2s}
#below{position:fixed;left:20px;right:20px;top:44%;bottom:118px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;overflow:hidden}
#frame{width:min(100%,200px);aspect-ratio:16/9;display:none;pointer-events:none;opacity:.9}
#stack{width:min(100%,360px);display:none;flex-direction:column;gap:3px;pointer-events:auto}
#stack.on{display:flex}
#stack .row{display:flex;align-items:center;gap:6px;height:18px;transition:height .3s}
#stack .row.open{height:64px;flex-wrap:wrap;align-content:flex-start}
#stack .lab{width:52px;flex:0 0 52px;text-align:left}
#stack .rowcv{flex:1 1 auto;height:18px}
#stack .row.open .rowcv{height:40px}
#stack .vals{flex:1 1 100%;padding-left:58px}
#strip{width:min(100%,340px);height:26px;display:none;pointer-events:auto;touch-action:none}
#strip.on{display:block}
#line{text-align:center;font-size:12px;letter-spacing:.14em;line-height:1.8;pointer-events:auto;white-space:pre-line;transition:opacity .9s;opacity:1;min-height:1.8em}
#line.dimmed{opacity:0}
#line button{text-decoration:underline;text-underline-offset:4px;letter-spacing:.14em}
#line .err{color:var(--rust)}
#panel{display:none;flex-direction:column;width:100%;gap:6px;align-items:center;text-align:center;pointer-events:auto;font-size:12px;letter-spacing:.06em;line-height:1.7}
#panel.on{display:flex;animation:rise .45s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#strip.on{animation:rise .45s ease-out}
#line.swap{opacity:0;transition:opacity .18s}
#panel .name{padding:2px 8px 6px;border-bottom:1px solid var(--line);max-width:100%}
#panel .when{font-size:10px;letter-spacing:.2em;color:var(--dim)}
#panel .text{max-width:36em;color:var(--ink)}
#panel .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:2px;max-width:100%}
#panel .acts button{padding:7px 8px;border:1px solid var(--line);flex:0 1 auto}
#panel .acts button.warn{border-color:var(--rust);color:var(--rust)}
#shelf{position:fixed;left:0;right:0;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 40px);display:flex;gap:14px;overflow-x:auto;padding:6px 20px;pointer-events:auto;scrollbar-width:none;justify-content:flex-start}
#shelf::-webkit-scrollbar{display:none}
#shelf.center{justify-content:center}
#shelf .m:nth-last-child(n+10):not(#memthumb){display:none}
#shelf .m{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.85}
#shelf .m.sel{opacity:1}
#shelf canvas{width:46px;height:46px;display:block}
#shelf .t{font-size:9px;letter-spacing:.12em;color:var(--dim)}
#shelf .m.sel .t{color:var(--ink)}
#status{bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:22px;font-size:10px;color:var(--dim);pointer-events:auto}
#status button{color:var(--dim);letter-spacing:.2em}
#status button.on{color:var(--ink)}
#status button.bad{color:var(--rust)}
@media (max-width:339px),(max-height:339px){ #top,#status,#below,#shelf{display:none!important} }
@media (min-width:700px){ #below{left:50%;right:auto;width:480px;transform:translateX(-50%)} #shelf{justify-content:center} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

<body>
<canvas id="stage" aria-label="the last fifteen seconds of this room as a sphere of marks"></canvas>
<div class="ui" id="top"><div id="title"></div><div id="sys"><div id="sysword"></div><div id="dot"></div></div></div>
<div id="below"><canvas id="frame" aria-label="what the eye sees now, as dots"></canvas><div id="stack"></div><canvas id="strip" hidden aria-label="the last fifteen seconds; drag to move the held window"></canvas><div id="panel" aria-live="polite"></div><div id="line"></div></div>
<div id="shelf" class="center" aria-label="kept moments"></div>
<div class="ui" id="status">
  <button id="s-hear">OFF</button>
  <button id="s-words">FLIP</button>
  <button id="s-streams">STREAMS</button>
  <button id="s-imu">IMU</button>
  <button id="s-gps">GPS</button>
  <button id="s-view">ORB</button>
  <button id="s-sound">SOUND OFF</button>
  <button id="s-theme">DARK</button>
</div>

<script>
/* ============================================================
   AMBIENT PRESENT  v3
   One sphere. Time is longitude: now at the right limb, older toward the back.
   WORLD -> TRACE (15 s ring of samples + slices) -> { ERASE | MEMORY (a sphere of its own) }
   The program assumes it is broken: every state prints what it is doing and the one thing
   to do next; every failure names its fix; the frame loop survives its own exceptions.
   ============================================================ */
'use strict';
const T_WINDOW=15, HZ=10, N=T_WINDOW*HZ, FW=192, FH=108, RINGS=32, HOLD_W=N, MIN_W=HZ, AUTO_DISSOLVE=9000;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ---------- palette (dark default; light on request or system) ---------- */
const PAL = {
  dark: {paper:'#0f0e0c', ink:[236,231,216], dim:'#6e675b', line:'#2a2620', ember:[224,162,74], rust:[201,103,58], warm:'#e0a24a'},
  light:{paper:'#efe9da', ink:[42,38,32],   dim:'#9a9283', line:'#d9d2c1', ember:[224,179,90], rust:[163,81,46],   warm:'#c9843c'}
};
let theme = (localStorage.getItem('ap.theme') || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
let P = PAL[theme];
function applyTheme(){ P=PAL[theme]; document.documentElement.classList.toggle('light', theme==='light'); try{ localStorage.setItem('ap.theme',theme); }catch(e){} }
applyTheme();

/* ---------- temporal model ---------- */
const slices = Array.from({length:N}, ()=>({e:0, tokens:[]}));
let head=0, sliceClock=0, curPeak=0, smoothE=0, frozen=false, lastFrame=null, audioPeak=0;
const slice = i => slices[(head - i + N*4) % N];
function pushSlice(e){ const prev=slices[head].e; head=(head+1)%N; const s=slices[head]; s.e=prev*0.6+e*0.4; s.tokens=[]; }

/* ---------- world state ---------- */
// INTRO (assembling) -> ASK (tap the sphere) -> LISTENING/REST <-> RECALL -> WORKING -> READING -> SAVE | DELETE ; FAULT ; STOPPED
let STATE='INTRO', hearing=false, simulate=false, wordsOK=false, wordsWhy='';
let audioCtx=null, analyser=null, buf=null, stream=null, video=null, facing='environment';
const dot=$('dot'), line=$('line'), panel=$('panel'), shelf=$('shelf');
const DOTCOL = s => ({INTRO:P.dim, ASK:P.dim, REST:`rgb(${P.ink})`, LISTENING:P.warm, RECALL:P.warm, WORKING:P.warm, READING:P.warm, SAVE:`rgb(${P.ink})`, DELETE:P.dim, FAULT:`rgb(${P.rust})`, STOPPED:P.dim})[s]||P.dim;

const SYSW={INTRO:'',ASK:'OFF',REST:'STILL',LISTENING:'SEEING',RECALL:'HELD',WORKING:'READING',READING:'READ',SAVE:'KEPT',DELETE:'LET GO',FAULT:'FAULT',STOPPED:'PAUSED'};
function sysWord(s){ const w=$('sysword'); const t=Mem.on?'ALL':(Play.m?(Play.m.space?'SPHERE':'PLAYING'):(VIEW==='SPACE'||VIEW==='CLOUD'?'SEEN '+Math.round(Space.coverage()*100)+'%':(SYSW[s]||''))); w.dataset.dot='{"size":0.9}'; dotText(w,t,{size:0.9,color:P.dim,max:120}); }
function say(html, cls){ if(Mem.on&&!/<[a-z]/i.test(html)) html=''; if(line.dataset.last===html) return; line.dataset.last=html; line.classList.add('swap'); setTimeout(()=>{ line.className = cls||''; if(/<[a-z]/i.test(html)){ line.innerHTML=html; delete line.dataset.text; } else { line.dataset.dot='{"size":1.15}'; dotText(line, dotWrap(html,34), {size:1.15}); } },180); }
function setState(s){
  const prev=STATE; STATE=s; dot.style.background=DOTCOL(s); sysWord(s);
  switch(s){
    case 'ASK':      say(hearing||simulate ? '' : 'tap the sphere\nso it can see the room'); break;
    case 'REST':
    case 'LISTENING': say(firstTaps<1 ? (VIEW==='PRO'?'move the phone. tap to hold the last 15 seconds':'tap the sphere to look back') : ''); break;
    case 'RECALL':   say('15 seconds held. trim on the strip.\nlet go on the sphere to read'); break;
    case 'WORKING':  say(''); break;
    case 'READING':  say(firstKeeps<2 ? 'drag the sphere up to keep it\nor down to let it go' : ''); break;
    case 'SAVE':     say('kept'); break;
    case 'DELETE':   say('let go'); break;
    case 'FAULT':    break;
    case 'STOPPED':  say('paused\ntap the sphere to listen again'); break;
  }
  if (s!=='READING' && s!=='SAVE' && !Mem.on) closePanel();
  Sonic.onState(s,prev); Haptic.onState(s,prev); Cue.onState(s,prev);
}
let firstTaps = +(localStorage.getItem('ap.taps')||0), firstKeeps = +(localStorage.getItem('ap.keeps')||0);

/* ---------- audio: hear ---------- */
async function ensureCtx(){ if(!audioCtx){ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); Sonic.init(audioCtx); Cue.init(audioCtx); } if(audioCtx.state==='suspended') await audioCtx.resume(); return audioCtx; }
async function startHearing(){
  say('asking for the camera');
  if (!window.isSecureContext){ fault('the camera needs an https page', 'open this page over https, or <button data-act="sim">watch a made-up room</button>'); return; }
  if (!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ fault('this browser cannot open a camera', 'try Safari, Chrome or Firefox, or <button data-act="sim">watch a made-up room</button>'); return; }
  try{
    await ensureCtx().catch(()=>{});
    if(stream) stream.getTracks().forEach(t=>t.stop());
    let mic=true; try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}}); }catch(e1){ mic=false; stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false}); }
    const ctx=await ensureCtx(); if(analyser){ try{ analyser.disconnect(); }catch(e){} analyser=null; } if(mic&&stream.getAudioTracks().length){ const src=ctx.createMediaStreamSource(new MediaStream(stream.getAudioTracks())); if(Cue.out) Cue.out.gain.value=0.18; analyser=ctx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0.6; src.connect(analyser); buf=new Uint8Array(analyser.fftSize); Tape.init(ctx,src); Field.ok.mic=true; } else { Field.ok.mic=false; Field.why.mic='microphone declined or absent'; }
    Field.ok.cam=true; if(!Field.ok.imu&&!Field.why.imu) Field.sensors();
    if(!video){ video=document.createElement('video'); video.muted=true; video.playsInline=true; video.setAttribute('playsinline',''); }
    video.srcObject=new MediaStream(stream.getVideoTracks()); await video.play();
    const tr=stream.getVideoTracks()[0]; tr.onended=()=>{ hearing=false; status(); fault('seeing stopped', 'tap the sphere to reconnect'); };
    Frames.init();
    const first=!hearing; hearing=true; simulate=false; status();
    if(first){ Cue.startup(); Haptic.pulse([10,60,10,60,18]); }
    if(STATE!=='LISTENING'&&STATE!=='REST') setState('LISTENING');
  }catch(e){
    const n=e&&e.name;
    if (n==='NotAllowedError'||n==='SecurityError') fault('camera declined', 'allow it in the browser\u2019s site settings (the lock icon by the address), then tap the sphere\nor <button data-act="sim">watch a made-up room</button>');
    else if (n==='NotFoundError'||n==='OverconstrainedError') fault('no camera found', '<button data-act="sim">watch a made-up room</button>');
    else if (n==='NotReadableError') fault('another app holds the camera', 'close it, then tap the sphere');
    else fault('could not start seeing ('+(n||'unknown')+')', 'tap the sphere to try again, or <button data-act="sim">watch a made-up room</button>');
  }
}
function startSim(){ simulate=true; hearing=false; Frames.init(); status(); ensureCtx().then(()=>{ Cue.startup(); }).catch(()=>{}); Haptic.pulse([10,60,10,60,18]); setState('LISTENING'); }
function fault(what, fix){ setState('FAULT'); say('<span class="err">'+what+'</span>\n'+(fix||''), ''); faultT=0; }
let faultT=0;
line.addEventListener('click', ev=>{ const b=ev.target.closest('button'); if(!b) return; ev.stopPropagation(); if(b.dataset.act==='sim') startSim(); });

let rec=null, recActive=false;
function startSpeech(){}
let simPhase=0, simTalking=false, simTimer=0;
/* ---------- frames: the trace as pictures. one frame, one mark ---------- */
const Frames={ ring:[], pos:0, prev:null, c:null, g:null,
  init(){ if(this.c) return; this.c=document.createElement('canvas'); this.c.width=FW; this.c.height=FH; this.g=this.c.getContext('2d',{willReadFrequently:true}); this.ring=new Array(N).fill(null); },
  grab(){
    if(!this.c) return {e:0,lum:0}; const g=this.g;
    if(video&&video.readyState>=2){ if(facing==='user'){ g.save(); g.translate(FW,0); g.scale(-1,1); g.drawImage(video,0,0,FW,FH); g.restore(); } else g.drawImage(video,0,0,FW,FH); }
    else if(simulate){ simPhase+=0.05; g.fillStyle='#222'; g.fillRect(0,0,FW,FH); g.fillStyle='#ddd'; const k=simTalking?3:1; for(let i=0;i<k;i++){ g.beginPath(); g.arc(FW/2+Math.sin(simPhase*(1+i*0.3))*FW*0.35, FH/2+Math.cos(simPhase*0.7+i)*FH*0.3, 6+i*2,0,7); g.fill(); } }
    else return {e:0,lum:0};
    const d=g.getImageData(0,0,FW,FH), a=d.data; let lum=0, diff=0; const n=FW*FH; const cur=new Float32Array(n);
    for(let i=0;i<n;i++){ const y=a[i*4]*0.299+a[i*4+1]*0.587+a[i*4+2]*0.114; cur[i]=y; lum+=y; if(this.prev) diff+=Math.abs(y-this.prev[i]); }
    const e=this.prev?Math.min(1,(diff/n)/28):0; this.prev=cur;
    return {e,lum:lum/n/255,img:d};
  },
  poses:new Array(N).fill(null),
  push(img){ this.ring[this.pos]=img; this.poses[this.pos]={t:Date.now(),fwd:Space.gotOne?Space.fwd.slice():null,up:Space.gotOne?Space.up.slice():null,tilt:Field.live.tilt.slice(),gps:Field.ok.gps?Field.live.place.slice(0,2):null}; this.pos=(this.pos+1)%N; },
  cutPoses(a0,a1){ const out=[]; for(let a=Math.min(N-1,Math.ceil(a1));a>=Math.floor(a0);a--){ const i=(this.pos-1-a+N*2)%N; if(this.ring[i]) out.push(this.poses[i]); } return out; },
  at(age){ return this.ring[(this.pos-1-age+N*2)%N]; },
  cut(a0,a1){ const out=[]; for(let a=Math.min(N-1,Math.ceil(a1)); a>=Math.floor(a0); a--){ const f=this.at(a); if(f) out.push(f); } return out; },
  encode(imgs){ const c=document.createElement('canvas'); c.width=FW; c.height=FH; const g=c.getContext('2d'); return imgs.map(d=>{ g.putImageData(d,0,0); return c.toDataURL('image/jpeg',0.66); }); },
  clear(){ this.ring.fill(null); this.prev=null; } };
function halftone(g, src, x, y, w, h, cols, color){
  const rows=Math.round(cols*FH/FW); const c=halftone.c||(halftone.c=document.createElement('canvas')); c.width=cols; c.height=rows; const cg=c.getContext('2d',{willReadFrequently:true});
  if(src instanceof ImageData){ const t=halftone.t||(halftone.t=document.createElement('canvas')); t.width=FW; t.height=FH; t.getContext('2d').putImageData(src,0,0); cg.drawImage(t,0,0,cols,rows); } else cg.drawImage(src,0,0,cols,rows);
  const a=cg.getImageData(0,0,cols,rows).data; const cw=w/cols, ch=h/rows; g.fillStyle=color;
  for(let r=0;r<rows;r++) for(let k=0;k<cols;k++){ const i=(r*cols+k)*4; const l=(a[i]*0.299+a[i+1]*0.587+a[i+2]*0.114)/255; const rad=(theme==='dark'?l:1-l)*cw*0.5; if(rad<0.25) continue; g.beginPath(); g.arc(x+k*cw+cw/2,y+r*ch+ch/2,rad,0,7); g.fill(); }
}
const Tape={ ctx:null,sr:48000,ring:null,pos:0,len:0,node:null,
  init(ctx,src){ if(this.node){ try{ this.node.disconnect(); }catch(e){} this.node=null; } if(!this.ring){ this.ctx=ctx; this.sr=ctx.sampleRate; this.len=this.sr*T_WINDOW; this.ring=new Float32Array(this.len); } if(!ctx.createScriptProcessor) return; const Pn=ctx.createScriptProcessor(4096,1,1);
    Pn.onaudioprocess=ev=>{ if(frozen||STATE==='STOPPED') return; const inp=ev.inputBuffer.getChannelData(0); for(let i=0;i<inp.length;i++){ this.ring[this.pos]=inp[i]; this.pos=(this.pos+1)%this.len; } };
    const mute=ctx.createGain(); mute.gain.value=0; src.connect(Pn); Pn.connect(mute); mute.connect(ctx.destination); this.node=Pn; },
  cut(a0,a1){ if(!this.ring) return null; const n=Math.max(0,Math.round((a1-a0)*this.sr)), out=new Float32Array(n); let st=(this.pos-Math.round(a1*this.sr)+this.len*2)%this.len; for(let i=0;i<n;i++) out[i]=this.ring[(st+i)%this.len]; return out; },
  wav(x){ const sr=this.sr,n=x.length,b=new ArrayBuffer(44+n*2),v=new DataView(b),W=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
    W(0,'RIFF');v.setUint32(4,36+n*2,true);W(8,'WAVE');W(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);W(36,'data');v.setUint32(40,n*2,true);
    for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,x[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true);} return new Blob([b],{type:'audio/wav'}); },
  clear(){ if(this.ring) this.ring.fill(0); Frames.clear(); } };
/* ================= FIELD: every stream the device will give, on one clock =================
   Each stream is a ring of N slices at HZ. Nothing is stored finer than it is displayed
   except the tape (raw audio) and the frames (raw video), which are kept for the moment
   you keep. The sphere shows every stream as a band of latitude; the stack below shows
   each as its own row of dots; tapping a row opens it, channel by channel, with numbers. */
const STREAMS=[
  {id:'audio', label:'AUDIO', ch:['level'], unit:'', band:[13,18], src:'mic'},
  {id:'motion',label:'VIDEO', ch:['motion'], unit:'', band:[19,24], src:'cam'},

/* ---------- a moment in motion: turns so the playhead sits at the limb of now; played marks glow and cool ---------- */
function momentMarks(m, phead, out){
  const E=m.slices||[], L=E.length||1, toks=m.toks||[]; const tokAt=new Map(); for(const [i,w] of toks) tokAt.set(i,w);
  const eAt=Math.min(L-1,Math.floor(phead*L)), eh=E[eAt]||0;
  for(const p of pts){
    const u=1-p.lon0/(Math.PI*2); const q=u*L, i0=Math.min(L-1,Math.floor(q)), i1=Math.min(L-1,i0+1), ff=q-i0; const e=(E[i0]||0)*(1-ff)+(E[i1]||0)*ff;
    let played=(phead-u+1)%1; const ahead=played>0.5; const lon=p.lon0-(1-phead)*Math.PI*2;
    const near=Math.exp(-Math.pow(Math.min(played,1-played)*30,2));
    const r=1+e*0.07*(1-Math.min(1,played*2))+eh*0.05*near;
    const cx=Math.cos(p.lat)*Math.cos(lon)*r, cy=Math.sin(p.lat)*r, cz=Math.cos(p.lat)*Math.sin(lon)*r;
    const x=cx*Math.cos(TILT)-cz*Math.sin(TILT), z=cx*Math.sin(TILT)+cz*Math.cos(TILT);
    let density=0.18+e*0.8; if(ahead) density*=0.45;
    const w=tokAt.get(i0); const token=!!w && p.ring===tokenRing(w) && p.id%3===0 && !ahead;
    out.push({id:p.id,x,y:cy,z,age:ahead?0.9:played,density,selected:played<0.035,token});
  }
  return out;
}

const EBML={SEGMENT:[0x18,0x53,0x80,0x67],TRACKS:[0x16,0x54,0xAE,0x6B],ENTRY:[0xAE],VIDEO:[0xE0],PROJECTION:[0x76,0x70],PROJTYPE:[0x76,0x71]};

  const newEntry=wrapEl(EBML.ENTRY,cat([buf.subarray(entry.dataStart,video.idStart),newVideo,buf.subarray(video.dataEnd,entry.dataEnd)]));
  const newTracks=wrapEl(EBML.TRACKS,cat([buf.subarray(tracks.dataStart,entry.idStart),newEntry,buf.subarray(entry.dataEnd,tracks.dataEnd)]));

  if(VIEW==='PRO'&&!(Play.m&&Play.m.space)){ if(STATE==='READING'){ /* fall through: chevrons and drag handled by the ORB path */ } else { p0={x:ev.clientX,y:ev.clientY}; pLast={x:ev.clientX,y:ev.clientY}; moved=false; cv.setPointerCapture(ev.pointerId); return; } }
  if(!Play.m&&VIEW!=='ORB'&&VIEW!=='PRO'){ p0={x:ev.clientX,y:ev.clientY}; pLast={x:ev.clientX,y:ev.clientY}; moved=false; cv.setPointerCapture(ev.pointerId); return; }
  if(Mem.on){ p0={x:ev.clientX,y:ev.clientY}; pLast={x:ev.clientX,y:ev.clientY}; moved=false; cv.setPointerCapture(ev.pointerId); return; }
  if(STATE==='INTRO'){ intro.t=99; return; }
  if(STATE==='ASK'){ if(onSphere(ev.clientX,ev.clientY)) startHearing(); return; }
  if(STATE==='FAULT'){ if(hearing||simulate){ faultT=1e9; } else if(onSphere(ev.clientX,ev.clientY)) startHearing(); return; }
  if(STATE==='STOPPED'){ if(onSphere(ev.clientX,ev.clientY)) toggleStop(); return; }
  p0={x:ev.clientX,y:ev.clientY}; pLast={x:ev.clientX,y:ev.clientY}; moved=false; longPressed=false; cv.setPointerCapture(ev.pointerId);
  if(Play.m){ scrubWas=Play.playing; return; }
  clearTimeout(holdTimer); holdTimer=setTimeout(()=>{ if(!moved){ longPressed=true; toggleStop(); } },900);
  Cue.tap(); Haptic.pulse(6);
  if((STATE==='LISTENING'||STATE==='REST')){ if(panel.classList.contains('on')){ closePanel(); clearTimeout(holdTimer); p0=null; return; } lastTickSec=0; firstTaps++; try{localStorage.setItem('ap.taps',firstTaps);}catch(e){} select(); }
});
cv.addEventListener('pointermove', ev=>{ if(!p0) return; const dx=ev.clientX-pLast.x; pLast={x:ev.clientX,y:ev.clientY}; if(Math.hypot(ev.clientX-p0.x,ev.clientY-p0.y)>8){ moved=true; clearTimeout(holdTimer); } if(VIEW==='PRO'&&STATE!=='READING'&&!(Play.m&&Play.m.space)){ const dy=ev.clientY-pLast.y; proYaw+=dx/orbR(); proPitch=Math.max(-1.3,Math.min(1.3,proPitch+dy/orbR())); return; } if(!Play.m&&VIEW!=='ORB'&&VIEW!=='PRO'){ const dy=ev.clientY-pLast.y; if(VIEW==='SHELLS') explode=Math.max(0,Math.min(1,explode+dy/160)); else if(VIEW==='CLOUD'){ cloudYaw+=dx/orbR(); cloudPitch=Math.max(-1.3,Math.min(1.3,cloudPitch+dy/orbR())); } else if(VIEW==='SPACE'){ if(Space.oriOK) Space.rot+=dx/orbR()*1.2; else Space.aim(dx,dy); } else if(VIEW==='FLAT'){ Space.rot+=dx/orbR(); } return; } if(Play.m&&Play.m.space){ if(VIEW==='CLOUD'){ cloudYaw+=dx/orbR(); } else Space.rot+=dx/orbR()*1.2; return; } if(Mem.on){ Mem.rot+=dx/orbR()*1.2; return; } if(Play.m){ if(moved){ if(Play.playing) Play.pause(); Play.off=Math.max(0,Math.min(Play.dur(),Play.off+dx/(orbR()*2)*Play.dur())); } return; } if(STATE==='RECALL') moveSelection(dx); if(STATE==='READING'){ dragY=ev.clientY-p0.y; } });
let scrubWas=false;
cv.addEventListener('pointerup', ev=>{ clearTimeout(holdTimer); if(VIEW==='PRO'&&STATE!=='READING'&&!(Play.m&&Play.m.space)&&p0){ if(!moved){ if(Play.m){ ensureCtx().then(()=>Play.toggle()); } else if((STATE==='LISTENING'||STATE==='REST')&&onSphere(ev.clientX,ev.clientY)){ Cue.tap(); Haptic.pulse(6); select(); resolve(); } else if(STATE==='ASK'||STATE==='FAULT'||STATE==='STOPPED'){ if(STATE==='STOPPED') toggleStop(); else startHearing(); } } p0=null; return; } if(!Play.m&&VIEW!=='ORB'&&VIEW!=='PRO'&&p0){ const dy=ev.clientY-p0.y; if(VIEW==='SPACE'&&dy<-60&&Math.abs(dy)>Math.abs(ev.clientX-p0.x)) Space.keep(); p0=null; return; } if(Mem.on&&p0){ if(!moved){ const m=Mem.pick(ev.clientX,ev.clientY); if(m){ Cue.tap(); Haptic.pulse(6); openMoment(m); } else if(!onSphere(ev.clientX,ev.clientY)) Mem.close(); } p0=null; return; } if(Play.m&&p0){ if(moved){ if(scrubWas) Play.start(); } else { if(onSphere(ev.clientX,ev.clientY)) ensureCtx().then(()=>Play.toggle()); else closePanel(); } p0=null; return; } if(!p0||longPressed){ p0=null; return; } const dy=ev.clientY-p0.y, dx=ev.clientX-p0.x;
  if(STATE==='RECALL') resolve(); else if(STATE==='READING'){ if(dy<-60&&Math.abs(dy)>Math.abs(dx)) keep(); else if(dy>60&&Math.abs(dy)>Math.abs(dx)) dissolveMoment(); } p0=null; });
cv.addEventListener('pointercancel',()=>{ clearTimeout(holdTimer); p0=null; });
addEventListener('keydown', ev=>{ if(ev.target.isContentEditable) return; if(STATE==='ASK'&&(ev.key===' '||ev.key==='Enter')) startHearing(); else if(ev.key===' '&&(STATE==='LISTENING'||STATE==='REST')) select(); else if(ev.key===' '&&STATE==='RECALL') resolve(); else if(ev.key==='ArrowLeft'&&STATE==='RECALL') moveSelection(-40); else if(ev.key==='ArrowRight'&&STATE==='RECALL') moveSelection(40); else if(ev.key==='ArrowUp'&&STATE==='READING') keep(); else if(ev.key==='ArrowDown'&&STATE==='READING') dissolveMoment(); else if(ev.key==='Escape') closePanel(); });
document.addEventListener('visibilitychange',()=>{ if(!Sonic.ctx) return; if(document.hidden&&Sonic.on) Sonic.ctx.suspend(); else if(Sonic.on) Sonic.ctx.resume(); });

/* ---------- title: one line, letter by letter, while the sphere assembles ---------- */
(function title(){ const s='ONION PRO', t=$('title'); t.dataset.dot='{"size":1.6,"align":"left"}'; let i=0; if(reduceMotion){ dotText(t,s,{size:1.2,align:'left'}); return; } const iv=setInterval(()=>{ dotText(t,s.slice(0,++i),{size:1.2,align:'left'}); if(i>=s.length) clearInterval(iv); },90); })();

/* ---------- install manifest (runtime blob) ---------- */
(function manifest(){ try{ const icon=n=>{ const c=document.createElement('canvas'); c.width=c.height=n; const g=c.getContext('2d'); g.fillStyle='#0f0e0c'; g.fillRect(0,0,n,n); g.fillStyle='#ece7d8'; for(let i=0;i<8;i++){ const a=i/8*Math.PI*2-Math.PI/2; g.beginPath(); g.arc(n/2+Math.cos(a)*n*0.34,n/2+Math.sin(a)*n*0.34,n*0.04,0,7); g.fill(); } g.fillStyle='#e0a24a'; g.beginPath(); g.arc(n*0.69,n*0.375,n*0.062,0,7); g.fill(); return c.toDataURL('image/png'); };
  const m={name:'Ambient Present',short_name:'Present',start_url:location.href.split('#')[0],display:'standalone',background_color:'#0f0e0c',theme_color:'#0f0e0c',description:'A smaller past, a brighter present.',icons:[{src:icon(192),sizes:'192x192',type:'image/png'},{src:icon(512),sizes:'512x512',type:'image/png'}]};
  const l=document.createElement('link'); l.rel='manifest'; l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})); document.head.appendChild(l); }catch(e){} })();

/* ---------- start ---------- */
status(); buildStack();
DB.open().then(()=>DB.all()).then(list=>{ list.sort((a,b)=>a.start-b.start).forEach(m=>{ kept.push(m); Shelf.add(m,false); }); }).catch(()=>{ say('<span class="err">storage is unavailable</span>\nkept moments will last until you close the page'); });
if(intro.done) setState('ASK'); else setState('INTRO');
requestAnimationFrame(frame);
