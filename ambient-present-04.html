<style>
:root{ --paper:#0f0e0c; --ink:#ece7d8; --dim:#6e675b; --line:#2a2620; --ember:#e0a24a; --warm:#f2c962; --rust:#c9673a; }
html.light{ --paper:#efe9da; --ink:#2a2620; --dim:#9a9283; --line:#d9d2c1; --ember:#c9843c; --warm:#e0b35a; --rust:#a3512e; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;transition:background .8s,color .8s}
#stage{position:fixed;inset:0;display:block}
button{appearance:none;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;padding:0}
button:focus-visible,[contenteditable]:focus-visible{outline:1px solid var(--ember);outline-offset:3px}
.ui{position:fixed;left:0;right:0;padding:0 20px;font-size:11px;letter-spacing:.2em;line-height:1.9;pointer-events:none}
#top{top:max(16px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start}
#title{white-space:pre;min-height:1.9em}
#dot{width:9px;height:9px;border-radius:50%;background:var(--dim);margin-top:6px;transition:background 1.2s}
#below{position:fixed;left:20px;right:20px;top:50%;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#strip{width:min(100%,360px);height:34px;display:none;pointer-events:auto;touch-action:none}
#strip.on{display:block}
#line{text-align:center;font-size:12px;letter-spacing:.14em;line-height:1.8;pointer-events:auto;white-space:pre-line;transition:opacity .9s;opacity:1;min-height:1.8em}
#line.dimmed{opacity:0}
#line button{text-decoration:underline;text-underline-offset:4px;letter-spacing:.14em}
#line .err{color:var(--rust)}
#panel{display:none;flex-direction:column;width:100%;gap:8px;align-items:center;text-align:center;pointer-events:auto;font-size:12px;letter-spacing:.06em;line-height:1.7}
#panel.on{display:flex}
#panel .name{font-size:13px;letter-spacing:.14em;padding:4px 10px;border-bottom:1px solid var(--line);min-width:6em;outline:none}
#panel .when{font-size:10px;letter-spacing:.2em;color:var(--dim)}
#panel .text{max-width:36em;color:var(--ink)}
#panel .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
#panel .acts button{font-size:10px;letter-spacing:.2em;padding:9px 11px;border:1px solid var(--line)}
#panel .acts button.warn{border-color:var(--rust);color:var(--rust)}
#shelf{position:fixed;left:0;right:0;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 40px);display:flex;gap:14px;overflow-x:auto;padding:6px 20px;pointer-events:auto;scrollbar-width:none;justify-content:flex-start}
#shelf::-webkit-scrollbar{display:none}
#shelf.center{justify-content:center}
#shelf .m{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.85}

#shelf .m.sel .t{color:var(--ink)}

@media (max-width:300px),(max-height:300px){ #top,#status{display:none} #line{font-size:9px} #shelf canvas{width:24px;height:24px} #shelf .t{display:none} #panel{font-size:9px} #panel .acts button{padding:6px} }

<body>
<canvas id="stage" aria-label="the last fifteen seconds of this room as a sphere of marks"></canvas>
<div class="ui" id="top"><div id="title"></div><div id="dot"></div></div>
<div id="below"><canvas id="strip" aria-label="the last fifteen seconds; drag to move the held window"></canvas><div id="panel" aria-live="polite"></div><div id="line"></div></div>
<div id="shelf" class="center" aria-label="kept moments"></div>
<div class="ui" id="status">
  <button id="s-hear">HEARING OFF</button>
  <button id="s-words">WORDS OFF</button>
  <button id="s-sound">SOUND OFF</button>
  <button id="s-theme">DARK</button>
</div>

<script>
/* ============================================================
   AMBIENT PRESENT  v3
   One sphere. Time is longitude: now at the right limb, older toward the back.
   WORLD -> TRACE (15 s ring of samples + slices) -> { ERASE | MEMORY (a sphere of its own) }
   The program assumes it is broken: every state prints what it is doing and the one thing
   to do next; every failure names its fix; the frame loop survives its own exceptions.
   ============================================================ */
'use strict';
const T_WINDOW=15, HZ=20, N=T_WINDOW*HZ, RINGS=32, HOLD_W=3*HZ, AUTO_DISSOLVE=9000;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ---------- palette (dark default; light on request or system) ---------- */
const PAL = {
  dark: {paper:'#0f0e0c', ink:[236,231,216], dim:'#6e675b', line:'#2a2620', ember:[224,162,74], rust:[201,103,58], warm:'#e0a24a'},
  light:{paper:'#efe9da', ink:[42,38,32],   dim:'#9a9283', line:'#d9d2c1', ember:[224,179,90], rust:[163,81,46],   warm:'#c9843c'}
};
let theme = (localStorage.getItem('ap.theme') || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
let P = PAL[theme];
function applyTheme(){ P=PAL[theme]; document.documentElement.classList.toggle('light', theme==='light'); $('s-theme').textContent = theme==='dark'?'DARK':'LIGHT'; try{ localStorage.setItem('ap.theme',theme); }catch(e){} }
applyTheme();

/* ---------- temporal model ---------- */
const slices = Array.from({length:N}, ()=>({e:0, tokens:[]}));
let head=0, sliceClock=0, curPeak=0, smoothE=0, frozen=false;
const slice = i => slices[(head - i + N*4) % N];
function pushSlice(e){ const prev=slices[head].e; head=(head+1)%N; const s=slices[head]; s.e=prev*0.6+e*0.4; s.tokens=[]; }

/* ---------- world state ---------- */
// INTRO (assembling) -> ASK (tap the sphere) -> LISTENING/REST <-> RECALL -> WORKING -> READING -> SAVE | DELETE ; FAULT ; STOPPED
let STATE='INTRO', hearing=false, simulate=false, wordsOK=false, wordsWhy='';
let audioCtx=null, analyser=null, buf=null, stream=null;
const dot=$('dot'), line=$('line'), panel=$('panel'), shelf=$('shelf');
const DOTCOL = s => ({INTRO:P.dim, ASK:P.dim, REST:`rgb(${P.ink})`, LISTENING:P.warm, RECALL:P.warm, WORKING:P.warm, READING:P.warm, SAVE:`rgb(${P.ink})`, DELETE:P.dim, FAULT:`rgb(${P.rust})`, STOPPED:P.dim})[s]||P.dim;

function say(html, cls){ line.innerHTML = html; line.className = cls||''; }
function setState(s){
  const prev=STATE; STATE=s; dot.style.background=DOTCOL(s);
  switch(s){
    case 'ASK':      say(hearing||simulate ? '' : 'tap the sphere\nso it can hear the room'); break;
    case 'REST':
    case 'LISTENING': say(firstTaps<1 ? 'tap the sphere to look back' : ''); break;
    case 'RECALL':   say('drag left for earlier\nlet go to read'); break;
    case 'WORKING':  say(''); break;
    case 'READING':  say('swipe up to keep\nswipe down to let it go'); break;
    case 'SAVE':     say('kept'); break;
    case 'DELETE':   say('let go'); break;
    case 'FAULT':    break;
    case 'STOPPED':  say('paused\ntap the sphere to listen again'); break;
  }
  if (s!=='READING' && s!=='SAVE') closePanel();
  Sonic.onState(s,prev); Haptic.onState(s,prev); Cue.onState(s,prev);
}
let firstTaps = +(localStorage.getItem('ap.taps')||0);

/* ---------- audio: hear ---------- */
async function ensureCtx(){ if(!audioCtx){ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); Sonic.init(audioCtx); Cue.init(audioCtx); } if(audioCtx.state==='suspended') await audioCtx.resume(); return audioCtx; }
async function startHearing(){
  say('asking for the microphone');
  if (!window.isSecureContext){ fault('the microphone needs an https page', 'open this page over https, or <button data-act="sim">watch a made-up room</button>'); return; }
  if (!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ fault('this browser cannot open a microphone', 'try Safari, Chrome or Firefox, or <button data-act="sim">watch a made-up room</button>'); return; }
  try{
    const ctx=await ensureCtx();
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const src=ctx.createMediaStreamSource(stream);
    analyser=ctx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0.6; src.connect(analyser); buf=new Uint8Array(analyser.fftSize);
    Tape.init(ctx,src);
    const tr=stream.getAudioTracks()[0]; tr.onended=()=>{ hearing=false; status(); fault('hearing stopped', 'tap the sphere to reconnect'); };
    hearing=true; simulate=false; status();
    startSpeech();
    Cue.startup(); Haptic.pulse([10,60,10,60,18]);
    setState('LISTENING');
  }catch(e){
    const n=e&&e.name;
    if (n==='NotAllowedError'||n==='SecurityError') fault('microphone declined', 'allow it in the browser\u2019s site settings (the lock icon by the address), then tap the sphere\nor <button data-act="sim">watch a made-up room</button>');
    else if (n==='NotFoundError') fault('no microphone on this device', '<button data-act="sim">watch a made-up room</button>');
    else if (n==='NotReadableError') fault('another app holds the microphone', 'close it, then tap the sphere');
    else fault('could not start hearing ('+(n||'unknown')+')', 'tap the sphere to try again, or <button data-act="sim">watch a made-up room</button>');
  }
}
function startSim(){ simulate=true; hearing=false; wordsOK=true; wordsWhy='made-up words'; status(); ensureCtx().then(()=>{ Cue.startup(); }).catch(()=>{}); Haptic.pulse([10,60,10,60,18]); setState('LISTENING'); }
function fault(what, fix){ setState('FAULT'); say('<span class="err">'+what+'</span>\n'+(fix||''), ''); faultT=0; }
let faultT=0;
line.addEventListener('click', ev=>{ const b=ev.target.closest('button'); if(!b) return; ev.stopPropagation(); if(b.dataset.act==='sim') startSim(); });

/* ---------- speech: one token, one mark ---------- */
let rec=null, recActive=false, lastFinalAt=performance.now();
function startSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ wordsOK=false; wordsWhy='this browser has no speech-to-text; sound is still kept'; status(); return; }
  try{
    rec=new SR(); rec.continuous=true; rec.interimResults=false; rec.lang=navigator.language||'en-US';
    rec.onresult=ev=>{ for(let i=ev.resultIndex;i<ev.results.length;i++){ const r=ev.results[i]; if(!r.isFinal) continue; placeTokens(r[0].transcript.trim().split(/\s+/).filter(Boolean), performance.now()-lastFinalAt); lastFinalAt=performance.now(); } };
    rec.onstart=()=>{ wordsOK=true; wordsWhy=''; status(); };
    rec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ wordsOK=false; wordsWhy='speech-to-text blocked; sound is still kept'; recActive=false; status(); } if(e.error==='network'){ wordsOK=false; wordsWhy='speech-to-text needs the network; sound is still kept'; status(); } };
    rec.onend=()=>{ if(recActive&&STATE!=='STOPPED') setTimeout(()=>{ try{rec.start();}catch(e){} },400); };
    recActive=true; rec.start();
  }catch(e){ wordsOK=false; wordsWhy='speech-to-text failed to start'; status(); }
}
function placeTokens(words, spanMs){
  const span=Math.min(N-1,Math.max(words.length*4,Math.round(spanMs/1000*HZ))), lag=Math.round(0.6*HZ);
  const voiced=[]; for(let a=lag;a<lag+span&&a<N;a++) if(slice(a).e>0.08) voiced.push(a);
  const pool=voiced.length?voiced:Array.from({length:span},(_,k)=>k+lag);
  words.forEach((w,k)=>{ const a=pool[Math.floor((words.length-1-k)/Math.max(1,words.length-1)*(pool.length-1))]; slice(a).tokens.push(w); });
}
const SIM_WORDS=['did','you','turn','off','the','oven','before','we','left','i','think','so','it','was','fine','she','said','check','again','later'];
let simPhase=0, simTalking=false, simTimer=0, simWordAt=0;

/* ---------- tape: the trace as samples ---------- */
const Tape={ ctx:null,sr:48000,ring:null,pos:0,len:0,
  init(ctx,src){ this.ctx=ctx; this.sr=ctx.sampleRate; this.len=this.sr*T_WINDOW; this.ring=new Float32Array(this.len);
    if(!ctx.createScriptProcessor) return; const Pn=ctx.createScriptProcessor(4096,1,1);
    Pn.onaudioprocess=ev=>{ if(frozen||STATE==='STOPPED') return; const inp=ev.inputBuffer.getChannelData(0); for(let i=0;i<inp.length;i++){ this.ring[this.pos]=inp[i]; this.pos=(this.pos+1)%this.len; } };
    const mute=ctx.createGain(); mute.gain.value=0; src.connect(Pn); Pn.connect(mute); mute.connect(ctx.destination); this.node=Pn; },
  cut(a0,a1){ if(!this.ring) return null; const n=Math.max(0,Math.round((a1-a0)*this.sr)), out=new Float32Array(n); let st=(this.pos-Math.round(a1*this.sr)+this.len*2)%this.len; for(let i=0;i<n;i++) out[i]=this.ring[(st+i)%this.len]; return out; },
  wav(x){ const sr=this.sr,n=x.length,b=new ArrayBuffer(44+n*2),v=new DataView(b),W=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
    W(0,'RIFF');v.setUint32(4,36+n*2,true);W(8,'WAVE');W(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);W(36,'data');v.setUint32(40,n*2,true);
    for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,x[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true);} return new Blob([b],{type:'audio/wav'}); },
  clear(){ if(this.ring) this.ring.fill(0); } };

/* ---------- cues, ambience, haptics ---------- */
const Cue={ ctx:null,out:null,
  init(ctx){ if(this.out) return; this.ctx=ctx; this.out=ctx.createGain(); this.out.gain.value=0.5; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2600; this.out.connect(f); f.connect(ctx.destination); },
  ok(){ return this.ctx&&this.ctx.state==='running'; },
  tone(f,t0,a,h,r,g=0.1,type='sine'){ const o=this.ctx.createOscillator(),gn=this.ctx.createGain(); o.type=type; o.frequency.value=f; gn.gain.value=0; o.connect(gn); gn.connect(this.out); o.start(t0); gn.gain.linearRampToValueAtTime(g,t0+a); gn.gain.setValueAtTime(g,t0+a+h); gn.gain.exponentialRampToValueAtTime(0.0005,t0+a+h+r); o.stop(t0+a+h+r+0.05); },
  startup(){ if(!this.ok()) return; const t=this.ctx.currentTime; this.tone(146.83,t,1.6,1,5,0.1); this.tone(220,t+1.1,1.8,1,5.5,0.08); this.tone(369.99,t+2.4,2,0.8,6,0.06); this.tone(587.33,t+3.6,2.2,0.4,6.5,0.035); },
  tap(){ if(this.ok()){ const t=this.ctx.currentTime; this.tone(880,t,0.005,0.02,0.09,0.08);} },
  tick(){ if(this.ok()){ const t=this.ctx.currentTime; this.tone(1320,t,0.003,0.01,0.05,0.04);} },
  onState(s){ if(!this.ok()) return; const t=this.ctx.currentTime;
    if(s==='RECALL') this.tone(330,t,0.02,0.05,0.5,0.07);
    else if(s==='READING'){ this.tone(440,t,0.01,0.05,0.6,0.07); this.tone(660,t+0.09,0.01,0.05,0.7,0.05); }
    else if(s==='SAVE'){ this.tone(293.66,t,0.02,0.1,1.6,0.09); this.tone(440,t+0.12,0.02,0.1,1.8,0.07); this.tone(587.33,t+0.26,0.03,0.2,2.6,0.06); }
    else if(s==='DELETE'){ this.tone(392,t,0.01,0.05,0.9,0.06); this.tone(261.63,t+0.18,0.02,0.05,1.4,0.05); }
    else if(s==='FAULT') this.tone(196,t,0.02,0.1,0.8,0.05,'triangle');
    else if(s==='STOPPED'){ this.tone(220,t,0.01,0.05,0.5,0.06); this.tone(146.83,t+0.15,0.02,0.1,1.2,0.05); } } };
const Sonic={ on:false,ctx:null,master:null,filter:null,voices:[],timers:[],held:null,
  init(ctx){ if(this.ctx) return; this.ctx=ctx; this.master=ctx.createGain(); this.master.gain.value=0; this.filter=ctx.createBiquadFilter(); this.filter.type='lowpass'; this.filter.frequency.value=520; this.filter.Q.value=0.4; this.filter.connect(this.master); this.master.connect(ctx.destination);
    [[146.83,23.3],[220,31.1],[329.63,37.7],[369.99,43.9],[493.88,53.1]].forEach(([f,p],i)=>{ const g=ctx.createGain(); g.gain.value=0; g.connect(this.filter); const o1=ctx.createOscillator(); o1.type='sine'; o1.frequency.value=f; const o2=ctx.createOscillator(); o2.type='triangle'; o2.frequency.value=f*1.002; const g2=ctx.createGain(); g2.gain.value=0.18; o2.connect(g2); g2.connect(g); o1.connect(g); o1.start(); o2.start(); this.voices.push({g,p,off:i*5.7}); }); },
  swell(v){ const t=this.ctx.currentTime; v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.g.gain.value,t); v.g.gain.linearRampToValueAtTime(0.16,t+6); v.g.gain.linearRampToValueAtTime(0,t+15); },
  schedule(){ this.timers.forEach(clearTimeout); this.timers=[]; this.voices.forEach(v=>{ const loop=()=>{ if(!this.on) return; this.swell(v); this.timers.push(setTimeout(loop,v.p*1000)); }; this.timers.push(setTimeout(loop,v.off*1000)); }); },
  level(s){ return ({REST:0.05,LISTENING:0.08,RECALL:0.09,WORKING:0.09,READING:0.09,SAVE:0.08,DELETE:0.03,FAULT:0.02,STOPPED:0})[s]??0.05; },
  setOn(on){ this.on=on; if(!this.ctx) return; const t=this.ctx.currentTime; this.master.gain.cancelScheduledValues(t); this.master.gain.setValueAtTime(this.master.gain.value,t); this.master.gain.linearRampToValueAtTime(on?this.level(STATE):0,t+3); if(on) this.schedule(); else this.timers.forEach(clearTimeout); },
  room(e){ if(this.ctx&&this.on) this.filter.frequency.setTargetAtTime(420+e*900,this.ctx.currentTime,1.5); },
  onState(s,prev){ if(!this.ctx||!this.on) return; const t=this.ctx.currentTime; this.master.gain.setTargetAtTime(this.level(s),t,2);
    if(s==='RECALL'){ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.value=330; g.gain.value=0; o.connect(g); g.connect(this.filter); o.start(); g.gain.linearRampToValueAtTime(0.12,t+2.5); this.held={o,g}; }
    if(prev==='RECALL'&&this.held){ const h=this.held; this.held=null; h.g.gain.setTargetAtTime(0,t,1.2); h.o.stop(t+6); }
    if(s==='DELETE'||s==='FAULT'){ this.filter.frequency.setTargetAtTime(180,t,0.8); setTimeout(()=>{ if(this.ctx) this.filter.frequency.setTargetAtTime(520,this.ctx.currentTime,3); },3000); }
    if(s==='WORKING') this.filter.frequency.setTargetAtTime(1400,t,0.6); } };
const HPAT={RECALL:14,WORKING:[8,60,8],READING:22,SAVE:[18,90,18],DELETE:[6,40,4,60,2],FAULT:[4,30,4],STOPPED:30};

/* ---------- status row: each word is true and is its own control ---------- */

  const h=$('s-hear'), w=$('s-words'), so=$('s-sound');
  h.textContent = hearing?'HEARING ON':(simulate?'MADE-UP ROOM':'HEARING OFF'); h.className = hearing?'on':(simulate?'on':'');
  w.textContent = wordsOK?'WORDS ON':'WORDS OFF'; w.className = wordsOK?'on':(wordsWhy?'bad':''); w.title = wordsWhy;

}
$('s-hear').addEventListener('click', ev=>{ ev.stopPropagation(); Cue.tap(); if(hearing){ toggleStop(); } else startHearing(); });
$('s-words').addEventListener('click', ev=>{ ev.stopPropagation(); Cue.tap(); if(wordsWhy) say(wordsWhy); else if(!wordsOK&&hearing) startSpeech(); });

/* ---------- memory: each kept moment is its own sphere, on disk ---------- */
const DB={ db:null,
  open(){ return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error('no db')); const r=indexedDB.open('ambient-present',1); r.onupgradeneeded=()=>r.result.createObjectStore('moments',{keyPath:'id'}); r.onsuccess=()=>{ this.db=r.result; res(); }; r.onerror=()=>rej(r.error); }); },

const kept=[];
const hms = d => [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function autoName(m){ const w=(m.text||'').replace(/\[[A-Z]+\]/g,'').trim().split(/\s+/).filter(Boolean).slice(0,4).join(' '); return w || 'moment '+hms(new Date(m.start)); }

const Shelf={ sel:null,
  add(m, select){ const d=document.createElement('div'); d.className='m'; d.dataset.id=m.id; const c=document.createElement('canvas'); c.width=c.height=92; const t=document.createElement('div'); t.className='t'; t.textContent=hms(new Date(m.start)); d.append(c,t);
    d.addEventListener('click', ev=>{ ev.stopPropagation(); Cue.tap(); Haptic.pulse(6); openMoment(m); });
    shelf.appendChild(d); this.draw(c,m); shelf.classList.toggle('center', shelf.scrollWidth<=shelf.clientWidth); if(select){ this.select(m.id); shelf.scrollLeft=shelf.scrollWidth; } },
  draw(c,m){
    const g=c.getContext('2d'), n=c.width, R=n*0.42; g.clearRect(0,0,n,n); const E=m.slices||[]; const L=E.length||1;
    for(let r=0;r<12;r++){ const lat=-Math.PI/2+(r+0.5)/12*Math.PI; const k=Math.max(4,Math.round(Math.cos(lat)*30));
      for(let i=0;i<k;i++){ const lon=i/k*Math.PI*2; const x=Math.cos(lat)*Math.cos(lon), z=Math.cos(lat)*Math.sin(lon), y=Math.sin(lat); if(z<-0.1) continue;
        const e=E[Math.min(L-1,Math.floor((1-lon/(Math.PI*2))*L))]||0; const heat=Math.max(0,1-(lon/(Math.PI*2))*2.5)*(0.3+e*0.7); const cc=e>0.45?P.rust:P.ember; const ink=P.ink;
        g.fillStyle=`rgba(${Math.round(ink[0]+(cc[0]-ink[0])*heat)},${Math.round(ink[1]+(cc[1]-ink[1])*heat)},${Math.round(ink[2]+(cc[2]-ink[2])*heat)},${0.35+0.65*(z+1)/2})`;
        const s=(0.9+e*2.2)*(0.6+0.5*(z+1)/2); g.beginPath(); g.arc(n/2+x*R,n/2-y*R,s,0,7); g.fill(); } }
    if(m.masked){ g.fillStyle=P.warm; g.beginPath(); g.arc(n/2,n/2,3,0,7); g.fill(); } },
  redraw(){ shelf.querySelectorAll('.m').forEach(d=>{ const m=kept.find(x=>x.id===d.dataset.id); if(m) this.draw(d.querySelector('canvas'),m); }); },
  select(id){ this.sel=id; shelf.querySelectorAll('.m').forEach(d=>d.classList.toggle('sel',d.dataset.id===id)); },
  remove(id){ const d=shelf.querySelector(`.m[data-id="${id}"]`); if(d) d.remove(); shelf.classList.toggle('center', shelf.scrollWidth<=shelf.clientWidth); } };

/* ---------- playback: the moment's pattern on the main sphere, a playhead meridian, drag to scrub ---------- */
const Play={ m:null, buf:null, src:null, t0:0, off:0, playing:false, btn:null,
  async open(m){ this.close(); this.m=m; this.off=0; if(m.blob){ try{ const ctx=await ensureCtx(); const ab=await m.blob.arrayBuffer(); this.buf=await ctx.decodeAudioData(ab); }catch(e){ this.buf=null; } } },
  dur(){ return this.buf?this.buf.duration:(this.m?(this.m.end-this.m.start)/1000:0); },
  pos(){ if(!this.m) return 0; const d=this.dur(); if(!this.playing) return this.off; const p=this.off+(audioCtx.currentTime-this.t0); return p>=d?d:p; },
  start(){ if(!this.m) return; if(!this.buf){ this.playing=true; this.t0=audioCtx?audioCtx.currentTime:0; return; } const d=this.dur(); if(this.off>=d-0.02) this.off=0; this.stopSrc(); const s=audioCtx.createBufferSource(); s.buffer=this.buf; s.connect(audioCtx.destination); s.start(0,this.off); this.src=s; this.t0=audioCtx.currentTime; this.playing=true; s.onended=()=>{ if(this.src===s){ this.off=this.pos(); this.playing=false; this.src=null; if(this.btn) this.btn.textContent='PLAY'; } }; },
  pause(){ if(!this.playing) return; this.off=this.pos(); this.playing=false; this.stopSrc(); },
  stopSrc(){ if(this.src){ const x=this.src; this.src=null; try{ x.onended=null; x.stop(); }catch(e){} } },
  seek(t){ const d=this.dur(); t=Math.max(0,Math.min(d,t)); const was=this.playing; this.pause(); this.off=t; if(was) this.start(); },
  toggle(){ if(this.playing) this.pause(); else this.start(); if(this.btn) this.btn.textContent=this.playing?'STOP':'PLAY'; },
  close(){ this.pause(); this.m=null; this.buf=null; this.off=0; this.btn=null; } };
function closePanel(){ panel.classList.remove('on'); panel.innerHTML=''; Play.close(); Shelf.select(null); line.classList.remove('dimmed'); strip.classList.remove('on'); }
function openMoment(m){
  if (STATE==='READING'){ clearTimeout(dissolveTimer); release(); }
  closePanel(); Shelf.select(m.id); panel.classList.add('on'); say('');
  const name=document.createElement('div'); name.className='name'; name.contentEditable='true'; name.spellcheck=false; name.textContent=m.name; name.setAttribute('aria-label','name of this moment');
  name.addEventListener('blur',()=>{ m.name=name.textContent.trim()||autoName(m); name.textContent=m.name; DB.put(m).catch(()=>{}); });
  name.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); name.blur(); } });
  const when=document.createElement('div'); when.className='when'; const s=new Date(m.start), e=new Date(m.end); when.textContent=`${ymd(s)}  ${hms(s)} \u2013 ${hms(e)}  \u00b7 ${((m.end-m.start)/1000).toFixed(1)} s`;
  const text=document.createElement('div'); text.className='text'; text.textContent=m.text||''; if(!m.text) text.style.display='none';
  const acts=document.createElement('div'); acts.className='acts';
  const mk=(l,fn,cls)=>{ const b=document.createElement('button'); b.textContent=l; if(cls) b.className=cls; b.onclick=ev=>{ ev.stopPropagation(); Cue.tap(); Haptic.pulse(6); fn(b); }; acts.appendChild(b); return b; };
  const fname=()=>`present-${ymd(s)}-${hms(s).replace(/:/g,'')}`;
  Play.open(m).then(()=>{ if(Play.m===m) say('drag the sphere to scrub'); });
  strip.classList.add('on');
  if(m.blob){
    Play.btn=mk('PLAY',b=>{ ensureCtx().then(()=>{ Play.btn=b; Play.toggle(); }).catch(()=>say('<span class="err">could not play here</span>\nsave the file and open it')); });
    mk('SAVE',()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(m.blob); a.download=fname()+'.wav'; document.body.appendChild(a); a.click(); a.remove(); });
    if(navigator.share) mk('SHARE',async()=>{ const f=new File([m.blob],fname()+'.wav',{type:'audio/wav'}); const data={files:[f],title:m.name,text:`${m.name}\n${hms(s)}\n${m.text||''}`}; try{ if(navigator.canShare&&navigator.canShare(data)) await navigator.share(data); else await navigator.share({title:m.name,text:data.text}); }catch(e){} });
  } else if(navigator.share) mk('SHARE',async()=>{ try{ await navigator.share({title:m.name,text:`${m.name}\n${hms(s)}\n${m.text||''}`}); }catch(e){} });
  mk('REMOVE',b=>{ if(b.dataset.armed){ DB.del(m.id).catch(()=>{}); const i=kept.indexOf(m); if(i>=0) kept.splice(i,1); Shelf.remove(m.id); closePanel(); Cue.onState('DELETE'); } else { b.dataset.armed='1'; b.textContent='REMOVE, REALLY'; setTimeout(()=>{ delete b.dataset.armed; b.textContent='REMOVE'; },3000); } },'warn');
  mk('CLOSE',()=>closePanel());

}

/* ---------- selection / resolution ---------- */
let sel={start:0,w:HOLD_W,held:false}, resolved=null, dissolveTimer=0, dissolveT=0, convergence=0;
function select(){ frozen=true; sel.held=true; sel.start=0; closePanel(); strip.classList.add('on'); setState('RECALL'); }
let lastTickSec=0;
function moveSelection(dx){ const R=orbR(); sel.start=Math.max(0,Math.min(N-sel.w, sel.start+(-dx)/(R*2)*N*0.7)); const sec=Math.floor(sel.start/HZ); if(sec!==lastTickSec){ lastTickSec=sec; Haptic.tick(); } }
function resolve(){
  const now=Date.now(); const tokens=[], E=[]; let e=0,n=0;
  for(let a=Math.min(N-1,Math.ceil(sel.start+sel.w)); a>=Math.floor(sel.start); a--){ const s=slice(a); e+=s.e; n++; tokens.push(...s.tokens); E.push(+s.e.toFixed(3)); }
  resolved={ id:String(now)+Math.random().toString(36).slice(2,6), tokens, energy:n?e/n:0, slices:E, start:now-(sel.start+sel.w)/HZ*1000, end:now-sel.start/HZ*1000, samples:Tape.cut(sel.start/HZ,(sel.start+sel.w)/HZ) };
  convergence=0; setState('WORKING');
}
let working=false;
async function finishWorking(){
  if(working) return; working=true;
  try{
    let pk=0; if(resolved.samples) for(let i=0;i<resolved.samples.length;i+=16) pk=Math.max(pk,Math.abs(resolved.samples[i]));
    if(resolved.energy<0.04 && resolved.tokens.length===0 && pk<0.01){ fault('nothing there', 'that part of the past was silent'); return; }
    const raw=resolved.tokens.join(' '); const text=raw?await Models.mask(raw):'';
    if(STATE!=='WORKING'||!resolved) return;
    resolved.text=text; resolved.masked=text!==raw; resolved.name=autoName(resolved);
    setState('READING'); showRead(resolved);
    clearTimeout(dissolveTimer); dissolveTimer=setTimeout(()=>{ if(STATE==='READING') dissolveMoment(); },AUTO_DISSOLVE);
  } finally { working=false; }
}
function showRead(m){ panel.classList.add('on'); panel.innerHTML=''; const w=document.createElement('div'); w.className='when'; w.textContent=`${hms(new Date(m.start))} \u2013 ${hms(new Date(m.end))}`; const t=document.createElement('div'); t.className='text'; t.textContent=m.text||''; if(!m.text) t.style.display='none'; panel.append(w,t); }
async function keep(){
  clearTimeout(dissolveTimer); const m=resolved; if(!m) return;
  if(m.samples&&m.samples.length){ m.blob=Tape.wav(m.samples); } delete m.samples; delete m.tokens;
  kept.push(m); Shelf.add(m,false); setState('SAVE');
  try{ await DB.put(m); }catch(e){ say('kept for now\n<span class="err">could not write to storage; it will not survive a reload</span>'); }
  setTimeout(()=>release(),1600);
}
function dissolveMoment(){ clearTimeout(dissolveTimer); dissolveT=0; setState('DELETE'); }
function afterDissolve(){ for(let a=Math.floor(sel.start);a<sel.start+sel.w&&a<N;a++){ const s=slice(a); s.e=0; s.tokens=[]; } release(); }
function release(){ frozen=false; sel.held=false; resolved=null; strip.classList.remove('on'); setState(hearing||simulate?'LISTENING':'ASK'); }
function toggleStop(){
  if(STATE==='STOPPED'){ frozen=false; setState('LISTENING'); if(rec){ recActive=true; try{rec.start();}catch(e){} } }
  else { frozen=true; sel.held=false; resolved=null; for(const s of slices){ s.e=0; s.tokens=[]; } Tape.clear(); setState('STOPPED'); if(rec){ recActive=false; try{rec.stop();}catch(e){} } }
}

/* ---------- on-device models (optional; Desert Ant Redact if reachable, else local patterns) ---------- */
const Models={ redact:null,
  async load(){ if(window.AmbientModels){ this.redact=window.AmbientModels.redact; return; } try{ const m=await import('https://esm.sh/@desert-ant-labs/redact'); const r=await m.Redact.load(); this.redact=async t=>(await r.redaction(t)).redactedText; }catch(e){} },
  async mask(t){ if(this.redact){ try{ return await this.redact(t); }catch(e){} } return t.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,'[EMAIL]').replace(/\b(?:\d[ -]?){13,19}\b/g,'[CARD]').replace(/\b(?:\+?\d{1,3}[ -]?)?(?:\(?\d{3}\)?[ -]?)\d{3}[ -]?\d{4}\b/g,'[PHONE]').replace(/\b\d{3}-\d{2}-\d{4}\b/g,'[ID]'); } };
setTimeout(()=>Models.load(),4000);

/* ---------- visual score ---------- */
const pts=[]; for(let r=0;r<RINGS;r++){ const lat=-Math.PI/2+(r+0.5)/RINGS*Math.PI; const n=Math.max(6,Math.round(Math.cos(lat)*128)); for(let k=0;k<n;k++) pts.push({lat,lon0:k/n*Math.PI*2,ring:r,id:pts.length}); }
function tokenRing(w){ let h=0; for(const c of w) h=(h*31+c.charCodeAt(0))>>>0; return 5+(h%(RINGS-10)); }
const TILT=-0.35;
const ease = t => t<0?0:t>1?1:(1-Math.cos(t*Math.PI))/2;
let intro={t:0,done:reduceMotion};
function buildScore(){
  const frac=sliceClock/(1000/HZ), drift=frozen?0:frac/N*Math.PI*2, conv=reduceMotion?0:convergence, marks=[];
  const pm=Play.m, E=pm?(pm.slices||[]):null, L=E?E.length||1:0, pdur=pm?(Play.dur()||1):0, phead=pm?Play.pos()/pdur:0;
  for(const p of pts){
    let ageS,a,s,s2,age,f,e;
    if(pm){ age=p.lon0/(Math.PI*2); const u=(1-age)*L; const i0=Math.min(L-1,Math.floor(u)), i1=Math.min(L-1,i0+1), ff=u-i0; e=(E[i0]||0)*(1-ff)+(E[i1]||0)*ff; ageS=age*N; a=0; s={tokens:[]}; }
    else { ageS=p.lon0/(Math.PI*2)*N+(frozen?0:frac); a=Math.floor(ageS); s=slice(Math.min(N-1,a)); s2=slice(Math.min(N-1,a+1)); age=ageS/N; f=ageS-a; e=s.e*(1-f)+s2.e*f; }
    const lon=p.lon0-(pm?0:drift), r=1+e*0.07*(pm?1:(1-age))-conv*0.3;
    const cx=Math.cos(p.lat)*Math.cos(lon)*r, cy=Math.sin(p.lat)*r, cz=Math.cos(p.lat)*Math.sin(lon)*r;
    let x=cx*Math.cos(TILT)-cz*Math.sin(TILT), z=cx*Math.sin(TILT)+cz*Math.cos(TILT), y=cy;
    if(!intro.done){ const k=ease((intro.t-p.ring*0.07)/2.4); const ang=p.lon0*2+intro.t*(0.35+p.ring*0.045)*(p.ring%2?1:-1); const rad=2.6-p.ring*0.03; const ox=Math.cos(ang)*rad, oy=Math.sin(ang)*rad*0.55; x=ox+(x-ox)*k; y=oy+(y-oy)*k; z=-1+(z+1)*k; }
    const selected = pm ? (Math.abs((1-age)-phead)<0.035) : (sel.held&&ageS>=sel.start&&ageS<sel.start+sel.w);
    let density=0.18+e*0.8; if(!pm&&age>0.84) density*=(1-age)/0.16;
    const token = s.tokens.length && p.ring===tokenRing(s.tokens[0]) && p.id%3===0;
    marks.push({id:p.id,x,y,z,age,density,selected,token});
  }
  return marks;
}

/* ---------- strip ---------- */
const strip=$('strip'), sg=strip.getContext('2d');
function drawStrip(){
  const sw=strip.clientWidth, sh=strip.clientHeight; if(!sw) return; const d=Math.min(2,devicePixelRatio||1);
  if(strip.width!==sw*d){ strip.width=sw*d; strip.height=sh*d; } sg.setTransform(d,0,0,d,0,0); sg.clearRect(0,0,sw,sh);
  let E, win, head;
  if(Play.m){ E=Play.m.slices||[]; const dur=Play.dur()||1; head=Play.pos()/dur; win=null; }
  else if(sel.held){ E=[]; for(let a=N-1;a>=0;a--) E.push(slice(a).e); win=[1-(sel.start+sel.w)/N, 1-sel.start/N]; head=null; }
  else return;
  const L=E.length||1, bw=sw/L;
  for(let i=0;i<L;i++){ const e=E[i]||0; const inWin=win?(i/L>=win[0]&&i/L<win[1]):true; sg.fillStyle=`rgba(${P.ink},${inWin?0.9:0.25})`; const h=2+e*(sh-6); sg.fillRect(i*bw,sh/2-h/2,Math.max(1,bw-0.5),h); }
  if(win){ sg.strokeStyle=`rgb(${P.ink})`; sg.lineWidth=1; sg.strokeRect(win[0]*sw+0.5,0.5,(win[1]-win[0])*sw-1,sh-1); }
  if(head!=null){ sg.fillStyle=P.warm; sg.fillRect(head*sw-1,0,2,sh); }
}
let stripDrag=false;
strip.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); stripDrag=true; strip.setPointerCapture(ev.pointerId); stripTo(ev); });
strip.addEventListener('pointermove',ev=>{ if(stripDrag) stripTo(ev); });
strip.addEventListener('pointerup',ev=>{ if(!stripDrag) return; stripDrag=false; if(STATE==='RECALL') { /* window placed; release happens on the sphere */ } });
strip.addEventListener('pointercancel',()=>{ stripDrag=false; });
function stripTo(ev){ const r=strip.getBoundingClientRect(); const u=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));
  if(Play.m){ Play.seek(u*Play.dur()); }
  else if(sel.held){ const centerAge=(1-u)*N; const old=Math.floor(sel.start/HZ); sel.start=Math.max(0,Math.min(N-sel.w,centerAge-sel.w/2)); if(Math.floor(sel.start/HZ)!==old) Haptic.tick(); } }

/* ---------- renderer ---------- */
const cv=$('stage'), ctx=cv.getContext('2d'); let W=0,H=0;
function resize(){ const d=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize',resize); resize();
const orbR = () => Math.min(W*0.36, H*0.2);
const orbY = () => H*0.5 - orbR() - 28;
function drift(id,k){ const x=Math.sin(id*12.9898+k*78.233)*43758.5453; return x-Math.floor(x); }
function col(age,e){
  if(STATE==='FAULT') return `rgb(${P.rust})`; if(STATE==='DELETE') return P.dim;
  const heat=Math.max(0,1-age*3.5)*(0.35+e*0.65), c=e>0.45?P.rust:P.ember, i=P.ink;
  return `rgb(${Math.round(i[0]+(c[0]-i[0])*heat)},${Math.round(i[1]+(c[1]-i[1])*heat)},${Math.round(i[2]+(c[2]-i[2])*heat)})`;
}
function draw(marks,dissolve){
  const R=orbR(), cxp=W/2, cyp=orbY();
  ctx.fillStyle=P.paper; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=P.warm; ctx.globalAlpha=STATE==='STOPPED'||STATE==='INTRO'||STATE==='ASK'||Play.m?0.12:0.4; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,cyp); ctx.lineTo(W,cyp); ctx.stroke(); ctx.globalAlpha=1;
  marks.sort((a,b)=>a.z-b.z);
  const dimAll = STATE==='STOPPED'?0.25 : STATE==='ASK'?0.55 : 1;
  for(const m of marks){
    const front=(m.z+1)/2; let alpha=(0.22+front*0.7)*dimAll;
    if(sel.held&&!Play.m&&!m.selected) alpha*=0.5;
    let oy=0,ox=0; if(dissolve>0){ if(drift(m.id,1)<dissolve*1.1) continue; alpha*=(1-dissolve*0.6); oy=dissolve*dissolve*40*(0.5+drift(m.id,2)); ox=(drift(m.id,3)-0.5)*dissolve*18; }
    let size=(0.9+m.density*2.6)*(0.55+front*0.6)*(R/170); if(m.token) size*=1.8; if(m.selected) size*=1.2;
    ctx.globalAlpha=Math.min(1,alpha*Math.min(1,m.density*2+0.15));
    ctx.fillStyle=m.token?`rgb(${P.ink})`:col(m.age,m.density);
    ctx.beginPath(); ctx.arc(cxp+m.x*R+ox,cyp-m.y*R+oy,size,0,7); ctx.fill();

  if(sel.held&&!Play.m){ ctx.strokeStyle=`rgb(${P.ink})`; ctx.lineWidth=1; ctx.setLineDash([2,5]); for(const a of [sel.start,sel.start+sel.w]) meridian(a,cxp,cyp,R); ctx.setLineDash([]); }
  if(Play.m){ ctx.strokeStyle=P.warm; ctx.lineWidth=1.5; meridian((1-Play.pos()/(Play.dur()||1))*N,cxp,cyp,R); }
  if(STATE==='WORKING'&&!reduceMotion){ ctx.strokeStyle=`rgb(${P.ink})`; ctx.lineWidth=1; ctx.globalAlpha=0.35; for(let k=1;k<7;k++){ ctx.beginPath(); ctx.arc(cxp,cyp,R*(1-convergence*0.7)*k/7,0,7); ctx.stroke(); } ctx.globalAlpha=1; }
}
function meridian(ageS,cxp,cyp,R){ const d=(frozen||Play.m)?0:(sliceClock/(1000/HZ))/N*Math.PI*2, lon=ageS/N*Math.PI*2-d;
  for(const pass of [0,1]){ ctx.globalAlpha=pass?1:0.25; ctx.beginPath(); let open=false;
    for(let k=0;k<=48;k++){ const lat=-Math.PI/2+k/48*Math.PI; const cx=Math.cos(lat)*Math.cos(lon), cz=Math.cos(lat)*Math.sin(lon); const x=cx*Math.cos(TILT)-cz*Math.sin(TILT), z=cx*Math.sin(TILT)+cz*Math.cos(TILT); const px=cxp+x*R, py=cyp-Math.sin(lat)*R;
      const vis = pass ? z>=0 : z<0; if(!vis){ open=false; continue; } if(!open){ ctx.moveTo(px,py); open=true; } else ctx.lineTo(px,py); }
    ctx.stroke(); }
  ctx.globalAlpha=1; }

/* ---------- loop (survives its own errors) ---------- */
let last=performance.now(), errCount=0;
function frame(now){
  try{
    const dt=Math.min(100,now-last); last=now;
    if(!intro.done){ intro.t+=dt/1000; if(intro.t>2.4+RINGS*0.07+0.6){ intro.done=true; if(STATE==='INTRO') setState('ASK'); } }
    let e=0;
    if(hearing&&analyser){ analyser.getByteTimeDomainData(buf); let sum=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; sum+=v*v; } e=Math.min(1,Math.sqrt(sum/buf.length)*5); }
    else if(simulate){ simTimer-=dt; if(simTimer<=0){ simTalking=!simTalking; simTimer=simTalking?1800+Math.random()*3200:1500+Math.random()*5000; } simPhase+=dt*0.015; e=simTalking?0.2+0.45*Math.abs(Math.sin(simPhase))*(0.6+0.4*Math.random()):0.015*Math.random(); }
    curPeak=Math.max(curPeak,e); smoothE+=(e-smoothE)*(dt/900); Sonic.room(smoothE);
    const live = (hearing||simulate) && !frozen && STATE!=='STOPPED' && STATE!=='INTRO' && STATE!=='ASK';
    if(live){ sliceClock+=dt; while(sliceClock>=1000/HZ){ sliceClock-=1000/HZ; pushSlice(curPeak); curPeak=0; if(simulate&&simTalking&&Math.random()<0.5) slice(0).tokens.push(SIM_WORDS[simWordAt++%SIM_WORDS.length]); } }
    if(STATE==='REST'||STATE==='LISTENING'){ let r=0; for(let a=0;a<HZ*4;a++) r+=slice(a).e; r/=HZ*4; if(STATE==='REST'&&r>0.07) setState('LISTENING'); else if(STATE==='LISTENING'&&r<0.025) setState('REST'); }
    if(STATE==='WORKING'){ convergence=Math.min(1,convergence+dt/(reduceMotion?300:1100)); if(convergence>=1) finishWorking(); }
    let dissolve=0;
    if(STATE==='DELETE'){ dissolveT+=dt; dissolve=Math.min(1,dissolveT/(reduceMotion?400:1800)); if(dissolve>=1) afterDissolve(); }
    if(STATE==='FAULT'){ faultT+=dt; dissolve=Math.min(0.6,faultT/1800); if(faultT>4500){ frozen=false; sel.held=false; resolved=null; if(hearing||simulate) setState('LISTENING'); else { STATE='ASK'; dot.style.background=DOTCOL('ASK'); } } }
    draw(buildScore(),dissolve); drawStrip();
    errCount=0;
  }catch(err){ errCount++; if(errCount===1) say('<span class="err">something broke in the drawing</span>\nit is still listening; reload if this stays'); if(errCount>600){ frozen=false; sel.held=false; resolved=null; STATE=hearing||simulate?'LISTENING':'ASK'; errCount=0; } }
  requestAnimationFrame(frame);
}

/* ---------- gestures ---------- */
let p0=null,pLast=null,moved=false,holdTimer=0,longPressed=false;
function onSphere(x,y){ return Math.hypot(x-W/2,y-orbY())<orbR()*1.25; }
cv.addEventListener('pointerdown', ev=>{
  ensureCtx().catch(()=>{});
  if(STATE==='INTRO'){ intro.t=99; return; }
  if(STATE==='ASK'){ if(onSphere(ev.clientX,ev.clientY)) startHearing(); return; }
  if(STATE==='FAULT'){ if(hearing||simulate){ faultT=1e9; } else if(onSphere(ev.clientX,ev.clientY)) startHearing(); return; }
  if(STATE==='STOPPED'){ if(onSphere(ev.clientX,ev.clientY)) toggleStop(); return; }
  p0={x:ev.clientX,y:ev.clientY}; pLast={x:ev.clientX,y:ev.clientY}; moved=false; longPressed=false; cv.setPointerCapture(ev.pointerId);
  if(Play.m){ scrubWas=Play.playing; return; }
  clearTimeout(holdTimer); holdTimer=setTimeout(()=>{ if(!moved){ longPressed=true; toggleStop(); } },900);
  Cue.tap(); Haptic.pulse(6);
  if((STATE==='LISTENING'||STATE==='REST')){ if(panel.classList.contains('on')){ closePanel(); clearTimeout(holdTimer); p0=null; return; } lastTickSec=0; firstTaps++; try{localStorage.setItem('ap.taps',firstTaps);}catch(e){} select(); }
});
cv.addEventListener('pointermove', ev=>{ if(!p0) return; const dx=ev.clientX-pLast.x; pLast={x:ev.clientX,y:ev.clientY}; if(Math.hypot(ev.clientX-p0.x,ev.clientY-p0.y)>8){ moved=true; clearTimeout(holdTimer); } if(Play.m){ if(moved){ if(Play.playing) Play.pause(); Play.off=Math.max(0,Math.min(Play.dur(),Play.off+dx/(orbR()*2)*Play.dur())); } return; } if(STATE==='RECALL') moveSelection(dx); });
let scrubWas=false;
cv.addEventListener('pointerup', ev=>{ clearTimeout(holdTimer); if(Play.m&&p0){ if(moved){ if(scrubWas) Play.start(); } else { if(onSphere(ev.clientX,ev.clientY)) ensureCtx().then(()=>Play.toggle()); else closePanel(); } p0=null; return; } if(!p0||longPressed){ p0=null; return; } const dy=ev.clientY-p0.y, dx=ev.clientX-p0.x;
  if(STATE==='RECALL') resolve(); else if(STATE==='READING'){ if(dy<-50&&Math.abs(dy)>Math.abs(dx)) keep(); else if(dy>50&&Math.abs(dy)>Math.abs(dx)) dissolveMoment(); } p0=null; });
cv.addEventListener('pointercancel',()=>{ clearTimeout(holdTimer); p0=null; });
addEventListener('keydown', ev=>{ if(ev.target.isContentEditable) return; if(STATE==='ASK'&&(ev.key===' '||ev.key==='Enter')) startHearing(); else if(ev.key===' '&&(STATE==='LISTENING'||STATE==='REST')) select(); else if(ev.key===' '&&STATE==='RECALL') resolve(); else if(ev.key==='ArrowLeft'&&STATE==='RECALL') moveSelection(-40); else if(ev.key==='ArrowRight'&&STATE==='RECALL') moveSelection(40); else if(ev.key==='ArrowUp'&&STATE==='READING') keep(); else if(ev.key==='ArrowDown'&&STATE==='READING') dissolveMoment(); else if(ev.key==='Escape') closePanel(); });
document.addEventListener('visibilitychange',()=>{ if(!Sonic.ctx) return; if(document.hidden&&Sonic.on) Sonic.ctx.suspend(); else if(Sonic.on) Sonic.ctx.resume(); });

/* ---------- title: one line, letter by letter, while the sphere assembles ---------- */
(function title(){ const s='AMBIENT PRESENT', t=$('title'); let i=0; if(reduceMotion){ t.textContent=s; return; } const iv=setInterval(()=>{ t.textContent=s.slice(0,++i); if(i>=s.length) clearInterval(iv); },90); })();

/* ---------- install manifest (runtime blob) ---------- */
(function manifest(){ try{ const icon=n=>{ const c=document.createElement('canvas'); c.width=c.height=n; const g=c.getContext('2d'); g.fillStyle='#0f0e0c'; g.fillRect(0,0,n,n); g.fillStyle='#ece7d8'; for(let i=0;i<8;i++){ const a=i/8*Math.PI*2-Math.PI/2; g.beginPath(); g.arc(n/2+Math.cos(a)*n*0.34,n/2+Math.sin(a)*n*0.34,n*0.04,0,7); g.fill(); } g.fillStyle='#e0a24a'; g.beginPath(); g.arc(n*0.69,n*0.375,n*0.062,0,7); g.fill(); return c.toDataURL('image/png'); };
  const m={name:'Ambient Present',short_name:'Present',start_url:location.href.split('#')[0],display:'standalone',background_color:'#0f0e0c',theme_color:'#0f0e0c',description:'A smaller past, a brighter present.',icons:[{src:icon(192),sizes:'192x192',type:'image/png'},{src:icon(512),sizes:'512x512',type:'image/png'}]};
  const l=document.createElement('link'); l.rel='manifest'; l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})); document.head.appendChild(l); }catch(e){} })();

/* ---------- start ---------- */
status();
DB.open().then(()=>DB.all()).then(list=>{ list.sort((a,b)=>a.start-b.start).forEach(m=>{ kept.push(m); Shelf.add(m,false); }); }).catch(()=>{ say('<span class="err">storage is unavailable</span>\nkept moments will last until you close the page'); });
if(intro.done) setState('ASK'); else setState('INTRO');
requestAnimationFrame(frame);
</script>
</body>
